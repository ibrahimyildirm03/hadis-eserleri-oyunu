<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B4D">
<meta name="description" content="Hadis eserleri, müellifleri ve âlimlerin vefat yılları üzerine öğrenme oyunları.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hadis Oyunları">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Hadis Oyunları</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231E2B4D'/%3E%3Cg fill='%23E2B45F'%3E%3Crect x='27.5' y='8.5' width='9' height='9'/%3E%3Crect x='27.5' y='8.5' width='9' height='9' transform='rotate(45 32 13)'/%3E%3C/g%3E%3Cpath d='M32 28c-5-3.5-11-4.5-17-4v22c6-.5 12 .5 17 4 5-3.5 11-4.5 17-4V24c-6-.5-12 .5-17 4z' fill='%23F6EFE3'/%3E%3Cpath d='M32 28v22' stroke='%231E2B4D' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* Layout: uygulama gibi tek sütun — üstte logo çubuğu, ana sayfada iki oyun kartı, oyun içinde hap sekmeler + kartlar.
   Gündüz: krem zemin, kahve vurgu, lacivert ikincil. Gece: lacivert zemin, krem yazı, altın vurgu (kahve yok). */
:root{
  --paper:#F6EFE3; --surface:#FFFBF5; --surface-2:#F0E6D6; --ink:#2A1D15; --muted:#7B6757; --line:#E6D9C6;
  --accent:#7A4A2A; --accent-ink:#FFF8EE; --accent-soft:#F1E1CD; --navy:#1E2B4D; --gold:#9C6B3C; --sel:#EEDDC7;
  --hero-a:#1E2B4D; --hero-b:#2D4170; --hero-ink:#F6EFE3; --hero-muted:#CBD1E0; --hero-accent:#E2B45F;
  --ok:#2F6B45; --ok-bg:#E3EEDD; --bad:#A23A2E; --bad-bg:#F7E0DA;
  --shadow:0 1px 2px rgba(42,29,21,.06), 0 8px 24px rgba(42,29,21,.07);
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0B1330; --surface:#131D3F; --surface-2:#1A264E; --ink:#F2ECE0; --muted:#A5AECB; --line:#26335F;
  --accent:#E2B45F; --accent-ink:#141A33; --accent-soft:#2A3561; --navy:#A9BCF0; --gold:#E9C784; --sel:#2B3A70;
  --hero-a:#1B2A5C; --hero-b:#2C4385; --hero-ink:#F2ECE0; --hero-muted:#C3CCE8; --hero-accent:#F0C56E;
  --ok:#86D3A4; --ok-bg:#15383A; --bad:#F2A091; --bad-bg:#3E1F33;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28); color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0B1330; --surface:#131D3F; --surface-2:#1A264E; --ink:#F2ECE0; --muted:#A5AECB; --line:#26335F;
  --accent:#E2B45F; --accent-ink:#141A33; --accent-soft:#2A3561; --navy:#A9BCF0; --gold:#E9C784; --sel:#2B3A70;
  --hero-a:#1B2A5C; --hero-b:#2C4385; --hero-ink:#F2ECE0; --hero-muted:#C3CCE8; --hero-accent:#F0C56E;
  --ok:#86D3A4; --ok-bg:#15383A; --bad:#F2A091; --bad-bg:#3E1F33;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28); color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 56px;
  transition:background-color .25s, color .25s;-webkit-tap-highlight-color:transparent}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Uygulama çubuğu */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand svg{width:44px;height:44px;flex:0 0 44px;border-radius:12px;box-shadow:var(--shadow)}
.brand .nm{font-family:var(--display);font-size:24px;font-weight:600;line-height:1}
.brand .tg{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.themebtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.themebtn .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:inset -4px -2px 0 rgba(0,0,0,.25)}

/* Ana sayfa */
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:26px;padding:30px 28px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:30px solid var(--hero-accent);opacity:.14;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-accent);font-weight:800}
.hero h1{font-size:clamp(36px,7vw,58px);margin:8px 0 10px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--hero-muted);max-width:56ch}
.games{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.gcard .ic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.gcard h2{font-size:26px}
.gcard p{margin:0;color:var(--muted);font-size:15px}
.gcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.gcard .go{margin-top:auto;font-weight:800;color:var(--accent)}
.pill{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--surface-2)}
.install{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.install p{margin:0;color:var(--muted);font-size:14.5px;max-width:52ch}

/* Oyun ekranı */
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.ghead h2{font-size:clamp(26px,5vw,34px)}
.modes{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode{flex:1 0 auto;background:none;border:0;padding:10px 16px;font-size:14.5px;font-weight:700;color:var(--muted);border-radius:999px;white-space:nowrap;min-height:42px}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

details.filter{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2px 18px;box-shadow:var(--shadow)}
details.filter summary{cursor:pointer;padding:13px 0;font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;list-style:none}
details.filter summary::-webkit-details-marker{display:none}
details.filter summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .2s}
details.filter[open] summary::before{transform:rotate(45deg)}
details.filter summary .n{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--muted)}
.fbody{display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{background:none;border:0;padding:0;text-align:left;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.linkbtn{background:var(--accent-soft);border:0;color:var(--accent);font-weight:700;padding:7px 13px;border-radius:999px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}

.scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.scorebar span{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px 13px;font-size:12.5px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:1px}
.scorebar b{color:var(--ink);font-size:21px;font-variant-numeric:tabular-nums;font-weight:800;line-height:1.15}

.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.card.flash-ok{box-shadow:0 0 0 3px var(--ok)} .card.flash-bad{box-shadow:0 0 0 3px var(--bad)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.qkind{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px}
.qtext{font-family:var(--display);font-weight:500;font-size:clamp(20px,3.4vw,27px);line-height:1.35;margin:14px 0 4px}
.qtext em{font-style:italic;color:var(--accent)}
.qtext strong{color:var(--navy);font-weight:600}
.qtext q{font-style:italic;quotes:"“" "”"}
.tf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.big{border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:15px;font-size:17px;font-weight:800;min-height:58px;transition:transform .12s,border-color .15s}
.opt{border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:13px 15px;font-size:16px;font-weight:600;text-align:left;line-height:1.3;overflow-wrap:anywhere;min-height:54px;transition:transform .12s,border-color .15s}
.opt .s,.big .s{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:3px}
.big:hover:not(:disabled),.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.big:disabled,.opt:disabled{cursor:default;opacity:.5}
.ok-c{background:var(--ok-bg)!important;border-color:var(--ok)!important;color:var(--ok)!important;opacity:1!important}
.bad-c{background:var(--bad-bg)!important;border-color:var(--bad)!important;color:var(--bad)!important;opacity:1!important}
.ok-c .s,.bad-c .s{color:inherit!important;opacity:.85}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:15px;min-height:46px}
.primary:hover{filter:brightness(1.07)}
.primary:disabled{opacity:.45;cursor:default;filter:none}
.secondary{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.after{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.verdict{font-weight:800;font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.infos{display:flex;flex-direction:column;gap:10px}

.kunye-box{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kunye-box .t{font-family:var(--display);font-size:19px;font-weight:600}
.kunye-box .x{color:var(--muted);font-size:14.5px}
.kunye-box .info{color:var(--ink);font-size:14.5px;border-left:3px solid var(--accent);padding-left:10px;margin-top:4px}
.mini{display:flex;flex-direction:column;gap:6px}
.mini div{font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:8px 12px}
.mini b{color:var(--ink)}
.date{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:800;white-space:nowrap}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--navy);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;flex-wrap:wrap;gap:2px}
.seg button{background:none;border:0;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.tile{text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;font-size:15.5px;font-weight:600;line-height:1.3;min-height:56px;overflow-wrap:anywhere}
.tile.sel{border-color:var(--accent);background:var(--sel)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.tile .s{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}
.tile.done .s{color:inherit;opacity:.8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Oklarla sıralama */
.sortlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.srow{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:16px;padding:10px 10px 10px 12px}
.srow .num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.srow .body{flex:1;min-width:0}
.srow .nm{font-weight:800;overflow-wrap:anywhere}
.srow .w{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.srow .info{font-size:13.5px;color:var(--ink);margin-top:4px}
.arrows{display:flex;flex-direction:column;gap:4px}
.arr{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.arr:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.arr:disabled{opacity:.3;cursor:default}
.arr svg{width:18px;height:18px}
.srow.ok{border-color:var(--ok);background:var(--ok-bg)} .srow.bad{border-color:var(--bad);background:var(--bad-bg)}
.srow.ok .num{background:var(--ok);color:var(--surface)} .srow.bad .num{background:var(--bad);color:var(--surface)}

/* Zamana karşı */
.timer{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.timer i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s linear}
.bigstat{font-family:var(--display);font-size:56px;font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}

/* Kartlar */
.flashcard{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;align-items:center}
.flashcard .t{font-family:var(--display);font-size:clamp(24px,5vw,34px);font-weight:600}
.flashcard .x{color:var(--muted)}

.search{width:100%;padding:13px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.search::placeholder{color:var(--muted)}
.yearin{max-width:190px;box-shadow:none;font-size:18px;font-weight:700}
.libgrp{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);font-weight:800;padding-top:18px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 20px 8px;box-shadow:var(--shadow)}
.section h3{font-size:22px;padding:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h3 span{font-family:var(--body);font-size:13px;color:var(--accent);font-weight:800;background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.section .def{color:var(--muted);font-size:14.5px;margin:4px 0 6px}
.entry{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.entry .t{font-family:var(--display);font-weight:600;font-size:18px;overflow-wrap:anywhere}
.entry .x{color:var(--muted);font-size:14.5px}
.entry .x strong{color:var(--ink)}
.empty{color:var(--muted);padding:20px 0}
.note{color:var(--muted);font-size:13.5px;margin:0}
@media (max-width:620px){
  .games{grid-template-columns:1fr}
  .scorebar{grid-template-columns:repeat(4,1fr);gap:6px} .scorebar span{padding:7px 9px;font-size:11px} .scorebar b{font-size:17px}
  .hero{padding:24px 20px;border-radius:22px}
  .card{padding:18px;border-radius:18px} .opts{grid-template-columns:1fr}
  .match{gap:8px} .tile{font-size:14.5px;padding:9px}
  .entry{grid-template-columns:56px 1fr} .section{padding:4px 14px 6px}
  .brand .nm{font-size:21px} .brand svg{width:40px;height:40px;flex-basis:40px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} .tile.wrong{animation:none} }
</style>

</head>
<body>
<div class="wrap">
  <div class="appbar">
    <button class="brand" id="brand" type="button" aria-label="Hadis Oyunları ana sayfa">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1E2B4D"/><g fill="#E2B45F"><rect x="27.5" y="8.5" width="9" height="9"/><rect x="27.5" y="8.5" width="9" height="9" transform="rotate(45 32 13)"/></g><path d="M32 28c-5-3.5-11-4.5-17-4v22c6-.5 12 .5 17 4 5-3.5 11-4.5 17-4V24c-6-.5-12 .5-17 4z" fill="#F6EFE3"/><path d="M32 28v22" stroke="#1E2B4D" stroke-width="2"/></svg>
      <span><span class="nm">Hadis Oyunları</span><br><span class="tg">Eserler · Âlimler · Vefat yılları</span></span>
    </button>
    <button class="themebtn" id="themeBtn" type="button"><span class="dot"></span><span id="themeLbl">Gece</span></button>
  </div>
  <main id="app" class="panel"></main>
</div>

<script>

/* ---------- Müellifler: [ad, hicrî vefat] ---------- */
const A = {
 hemmam:["Hemmâm b. Münebbih",131], ibnishak:["İbn İshak",151], mamer:["Ma'mer b. Râşid",153],

 vefat:{title:"Vefat Yılları", modes:{mc:"Test", type:"Yazarak", pair:"Önce mi, sonra mı?", sort:"Sıralama", match:"Eşleştirme", speed:"Zamana Karşı", list:"Liste"}}

/* ---------- bilgi kutuları ---------- */
function kunye(e){
  return `<div class="kunye-box">
    <div class="t">${esc(e.t)}</div>
    <div>${esc(aName(e.a))} <span class="date">ö. h. ${aDate(e.a)}</span></div>
    <div class="x"><span class="tag">${esc(CATS[e.k].s)}</span>${e.of?` · Konusu: ${esc(e.of)}`:""}</div>
    ${e.n?`<div class="info">${esc(e.n)}</div>`:""}
  </div>`;
}
function mini(e){ return `<div><b>${esc(e.t)}</b> · ${esc(aName(e.a))} <span class="date">h. ${aDate(e.a)}</span> · ${esc(CATS[e.k].s)}${e.n?`<br>${esc(e.n)}`:""}</div>`; }
function person(p){
  return `<div class="kunye-box"><div class="t">${esc(p.n)}</div>
    <div><span class="date">ö. h. ${p.d}</span> · hicrî ${century(p.d)}. asır</div>
    <div class="info">${esc(p.note)}</div></div>`;
}

/* ---------- skor ---------- */
function scoreHTML(){
  const pct = score.all?Math.round(100*score.ok/score.all):0;
  return `<span>Doğru<b>${score.ok}/${score.all}</b></span><span>Başarı<b>%${pct}</b></span><span>Seri<b>${score.streak}</b></span><span>En iyi<b>${score.best}</b></span>`;
}
function tally(ok){
  score.all++; if(ok){score.ok++;score.streak++; if(score.streak>score.best){score.best=score.streak; store.set("hadis.best",score.best);} } else score.streak=0;
  const sb=$("#scorebar"); if(sb) sb.innerHTML=scoreHTML();
}
const tooSmall = msg=>`<div class="card empty">${msg||"Soru üretmek için yeterli kayıt yok. Süzgeçten daha fazla tür veya dönem seçin."}</div>`;
const tfQ = (kind,q,truth,info)=>({kind, q, layout:"tf", info, opts:[{label:"Doğru",ok:truth},{label:"Yanlış",ok:!truth}]});

function otherAuthor(e, p){
  const banned = byKey[e.key];
  let c = [...new Set(p.map(x=>x.a))].filter(a=>!banned.has(a) && Math.abs(aDate(a)-aDate(e.a))<=300);
  if(c.length<2) c = Object.keys(A).filter(a=>!banned.has(a));
  return pick(c);
}
const ESER_TF = {
  author(p){ const e=pick(p.filter(unamb)); if(!e) return null; const t=Math.random()<.5; const who=t?e.a:otherAuthor(e,p);
    return tfQ("Müellif",`<em>«${esc(e.t)}»</em> adlı eseri <strong>${esc(aName(who))}</strong> yazmıştır.`,t,kunye(e)); },
  date(p){ const e=pick(p); const t=Math.random()<.5; let d=aDate(e.a);
    if(!t){ let nd; do{ nd=d+(Math.random()<.5?-1:1)*(8+rnd(110)); }while(nd<100||nd===d||nd>1445); d=nd; }
    return tfQ("Vefat yılı",`<em>«${esc(e.t)}»</em> müellifi ${esc(aName(e.a))}, <strong>h. ${d}</strong> yılında vefat etmiştir.`,t,kunye(e)); },
  century(p){ const e=pick(p); const t=Math.random()<.5; let c=century(aDate(e.a));
    if(!t) c=pick([c-2,c-1,c+1,c+2].filter(x=>x>=2&&x<=15));
    return tfQ("Asır",`<em>«${esc(e.t)}»</em> müellifi ${esc(aName(e.a))}, <strong>hicrî ${c}. asırda</strong> vefat etmiştir.`,t,kunye(e)); },
  cat(p){ const e=pick(p); const t=Math.random()<.5; const k=t?e.k:pick(Object.keys(CATS).filter(c=>groupOf[c]!==groupOf[e.k]));
    return tfQ("Tür",`<em>«${esc(e.t)}»</em>, ${esc(CATS[k].p)} biridir.`,t,kunye(e)); },
  of(p){ const w=p.filter(e=>e.of); if(!w.length) return null; const e=pick(w); const t=Math.random()<.5;
    const of=t?e.of:pick([...new Set(ENT.filter(x=>x.of&&!ofClash(x.of,e.of)).map(x=>x.of))]);
    return tfQ("Konusu",`<em>«${esc(e.t)}»</em>, <strong>${esc(of)}</strong> üzerine yazılmış bir çalışmadır.`,t,kunye(e)); },
  before(p){ const e=pick(p); const others=p.filter(x=>Math.abs(aDate(x.a)-aDate(e.a))>=10); if(!others.length) return null; const o=pick(others);
    return tfQ("Önce / sonra",`<strong>${esc(aName(e.a))}</strong> (${esc(e.t)}), <strong>${esc(aName(o.a))}</strong> (${esc(o.t)}) adlı âlimden <strong>önce</strong> vefat etmiştir.`,aDate(e.a)<aDate(o.a),kunye(e)+kunye(o)); },
  note(p){ const w=p.filter(e=>e.n && !e.n.startsWith("Aynı adı")); if(w.length<2) return null; const e=pick(w); const t=Math.random()<.5;
    let src=e; if(!t){ const c=w.filter(x=>groupOf[x.k]!==groupOf[e.k]); if(!c.length) return null; src=pick(c); }
    return tfQ("Açıklama",`<em>«${esc(e.t)}»</em> hakkında: <q>${esc(src.n)}</q>`,t,kunye(e)+(t?"":`<p class="note">Bu açıklama aslında şu esere ait:</p>${kunye(src)}`)); }
};
function eserTF(){ const p=pool(); for(let i=0;i<20;i++){ const g=pick(["author","author","date","date","century","cat","of","of","before","note"]); const q=ESER_TF[g](p); if(q) return q; } return null; }

const ESER_MC = {
  author(p){ const e=pick(p.filter(unamb)); if(!e) return null; const banned=byKey[e.key];
    const c=shuffle([...new Set(ENT.map(x=>x.a))].filter(a=>!banned.has(a)&&Math.abs(aDate(a)-aDate(e.a))<=350)).slice(0,3);
    return {kind:"Müellif", q:`<em>«${esc(e.t)}»</em> adlı eserin müellifi kimdir?`, info:kunye(e),
      opts:[{label:aName(e.a),ok:true},...c.map(a=>({label:aName(a),ok:false}))]}; },
  byAuthor(p){ const e=pick(p.filter(unamb)); if(!e) return null;
    const w=shuffle(ENT.filter(x=>unamb(x)&&x.a!==e.a&&Math.abs(aDate(x.a)-aDate(e.a))<=250)).slice(0,3);
    return {kind:"Müellif", q:`Aşağıdakilerden hangisi <strong>${esc(aName(e.a))}</strong> adlı âlimin eseridir?`, info:kunye(e)+`<div class="mini">${w.map(mini).join("")}</div>`,
      opts:[{label:e.t,ok:true},...w.map(x=>({label:x.t,sub:"",ok:false}))]}; },
  date(p){ const e=pick(p); const d=aDate(e.a); const ds=[d]; let g=0;
    while(ds.length<4&&g++<300){ const nd=d+(Math.random()<.5?-1:1)*(10+rnd(140)); if(nd<100||nd>1445||ds.some(x=>Math.abs(x-nd)<7)) continue; ds.push(nd); }
    return {kind:"Vefat yılı", q:`<em>«${esc(e.t)}»</em> müellifi <strong>${esc(aName(e.a))}</strong> hangi yılda vefat etmiştir?`, info:kunye(e),
      opts:ds.map(x=>({label:`h. ${x}`,ok:x===d}))}; },
  century(p){ const e=pick(p); const c=century(aDate(e.a)); const cs=shuffle([c-3,c-2,c-1,c+1,c+2,c+3].filter(x=>x>=2&&x<=15)).slice(0,3);
    return {kind:"Asır", q:`<em>«${esc(e.t)}»</em> hangi hicrî asırda yazılmıştır? <span class="note">(müellifin vefatına göre)</span>`, info:kunye(e),
      opts:[c,...cs].map(x=>({label:`${x}. asır`,ok:x===c}))}; },
  cat(p){ const e=pick(p); const others=shuffle(GROUPS.filter(g=>g.id!==groupOf[e.k])).slice(0,3).map(g=>pick(g.cats));
    return {kind:"Tür", q:`<em>«${esc(e.t)}»</em> (${esc(aName(e.a))}) hangi türdendir?`, info:kunye(e),
      opts:[{label:CATS[e.k].s,ok:true},...others.map(k=>({label:CATS[k].s,ok:false}))]}; },
  whichCat(p){ const k=pick([...new Set(p.map(e=>e.k))]); const r=pick(p.filter(e=>e.k===k)); const w=shuffle(ENT.filter(e=>groupOf[e.k]!==groupOf[k])).slice(0,3);
    return {kind:"Tür", q:`Aşağıdakilerden hangisi <strong>${esc(CATS[k].s.toLocaleLowerCase("tr"))}</strong> türünden bir eserdir?`, info:`<div class="mini">${[r,...w].map(mini).join("")}</div>`,
      opts:[{label:r.t,sub:aName(r.a),ok:true},...w.map(e=>({label:e.t,sub:aName(e.a),ok:false}))]}; },
  odd(p){ const counts={}; ENT.forEach(e=>(counts[e.k] ||= []).push(e));
    const cats=[...new Set(p.map(e=>e.k))].filter(k=>new Set(counts[k].map(e=>e.t)).size>=3); if(!cats.length) return null;
    const k=pick(cats); const same=[]; for(const e of shuffle(counts[k])){ if(!same.some(x=>x.t===e.t)) same.push(e); if(same.length===3) break; }
    const odd=pick(ENT.filter(e=>groupOf[e.k]!==groupOf[k]));
    return {kind:"Farklı olan", q:`Aşağıdakilerden hangisi diğerlerinden <strong>farklı bir türdendir</strong>?`, info:`<div class="mini">${[odd,...same].map(mini).join("")}</div>`,
      opts:[{label:odd.t,sub:aName(odd.a),ok:true},...same.map(e=>({label:e.t,sub:aName(e.a),ok:false}))]}; },
  notBy(p){ const counts={}; ENT.forEach(e=>{ if(unamb(e)) (counts[e.a] ||= []).push(e); });
    const pro=[...new Set(p.map(e=>e.a))].filter(a=>(counts[a]||[]).length>=3); if(!pro.length) return null;
    const a=pick(pro); const his=shuffle(counts[a]).slice(0,3); const other=pick(ENT.filter(e=>unamb(e)&&e.a!==a&&Math.abs(aDate(e.a)-aDate(a))<=300));
    return {kind:"Müellif", q:`Aşağıdakilerden hangisi <strong>${esc(aName(a))}</strong> (ö. h. ${aDate(a)}) adlı âlimin eseri <strong>değildir</strong>?`, info:kunye(other)+`<div class="mini">${his.map(mini).join("")}</div>`,
      opts:[{label:other.t,ok:true},...his.map(e=>({label:e.t,ok:false}))]}; },
  of(p){ const w=p.filter(e=>e.of); if(!w.length) return null; const e=pick(w);
    const wr=shuffle(ENT.filter(x=>!ofClash(x.of,e.of)&&!ofClash(x.t,e.of)&&x.key!==e.key)).slice(0,3);
    return {kind:"Konusu", q:`Aşağıdakilerden hangisi <strong>${esc(e.of)}</strong> üzerine yazılmış bir eserdir?`, info:kunye(e),
      opts:[{label:e.t,sub:aName(e.a),ok:true},...wr.map(x=>({label:x.t,sub:aName(x.a),ok:false}))]}; },
  note(p){ const w=p.filter(e=>e.n&&!e.n.startsWith("Aynı adı")); if(!w.length) return null; const e=pick(w);
    const wr=[]; for(const x of shuffle(ENT.filter(x=>x.key!==e.key&&groupOf[x.k]===groupOf[e.k]))){ if(!wr.some(y=>y.t===x.t)&&x.t!==e.t) wr.push(x); if(wr.length===3) break; }
    if(wr.length<3) return null;
    return {kind:"Açıklama", q:`Şu açıklama hangi esere aittir? <q>${esc(e.n)}</q>`, info:kunye(e),
      opts:[{label:e.t,sub:aName(e.a),ok:true},...wr.map(x=>({label:x.t,sub:aName(x.a),ok:false}))]}; },
  earliest(p){ const au=shuffle([...new Set(p.map(e=>e.a))]); const ch=[];
    for(const a of au){ if(ch.every(b=>Math.abs(aDate(b)-aDate(a))>=8)) ch.push(a); if(ch.length===4) break; }
    if(ch.length<4) return null; const late=Math.random()<.5; const tg=ch.slice().sort((x,y)=>late?aDate(y)-aDate(x):aDate(x)-aDate(y))[0];
    const ws=ch.map(a=>pick(p.filter(e=>e.a===a)));
    return {kind:"Kronoloji", q:`Aşağıdaki âlimlerden hangisi <strong>en ${late?"son":"önce"}</strong> vefat etmiştir?`, info:`<div class="mini">${ws.map(mini).join("")}</div>`,
      opts:ws.map(e=>({label:aName(e.a),sub:e.t,ok:e.a===tg,after:`h. ${aDate(e.a)}`}))}; }
};
function eserMC(){ const p=pool(); for(let i=0;i<30;i++){ const g=pick(["author","author","byAuthor","date","century","cat","whichCat","odd","notBy","of","note","note","earliest"]);
  const q=ESER_MC[g](p); if(q&&q.opts.length===4&&new Set(q.opts.map(o=>o.label)).size===4){ q.opts=shuffle(q.opts); return q; } } return null; }

/* ======================================================================
   VEFAT YILLARI — soru üreticileri
   ====================================================================== */
const VEF = {
  year(p){ const x=pick(p); const near=shuffle([...new Set(V.map(v=>v.d).filter(d=>Math.abs(d-x.d)>=3&&Math.abs(d-x.d)<=70))]); const o=near.slice(0,3);
    while(o.length<3){ const nd=x.d+(Math.random()<.5?-1:1)*(4+rnd(40)); if(nd>0&&!o.includes(nd)&&Math.abs(nd-x.d)>=3) o.push(nd); }
    return {kind:"Vefat yılı", q:`<strong>${esc(x.n)}</strong> hangi yılda vefat etmiştir?`, info:person(x), opts:[x.d,...o].map(d=>({label:`h. ${d}`,ok:d===x.d}))}; },
  cent(p){ const x=pick(p); const c=century(x.d); const cs=shuffle([c-2,c-1,c+1,c+2].filter(v=>v>=2&&v<=10)).slice(0,3);
    if(cs.length<3) return null;
    return {kind:"Asır", q:`<strong>${esc(x.n)}</strong> hangi hicrî asırda vefat etmiştir?`, info:person(x), opts:[c,...cs].map(v=>({label:`${v}. asır`,ok:v===c}))}; },
  whichCent(p){ const c=pick([...new Set(p.map(x=>century(x.d)))]); const r=pick(p.filter(x=>century(x.d)===c)); const w=shuffle(V.filter(x=>century(x.d)!==c)).slice(0,3);
    return {kind:"Asır", q:`Aşağıdakilerden hangisi <strong>hicrî ${c}. asırda</strong> vefat etmiştir?`, info:[r,...w].map(person).join(""),
      opts:[r,...w].map(x=>({label:x.n,ok:x===r,after:`h. ${x.d}`}))}; },
  earliest(p){ const ch=[]; for(const x of shuffle(p)){ if(ch.every(y=>Math.abs(y.d-x.d)>=3)) ch.push(x); if(ch.length===4) break; } if(ch.length<4) return null;
    const late=Math.random()<.5; const tg=ch.slice().sort((a,b)=>late?b.d-a.d:a.d-b.d)[0];
    return {kind:"Kronoloji", q:`Aşağıdakilerden hangisi <strong>en ${late?"son":"önce"}</strong> vefat etmiştir?`, info:ch.map(person).join(""),
      opts:ch.map(x=>({label:x.n,ok:x===tg,after:`h. ${x.d}`}))}; },
  gap(p){ let a,b,g=0; do{ a=pick(p); b=pick(p); }while(Math.abs(a.d-b.d)<5 && g++<50); const gap=Math.abs(a.d-b.d); if(gap<5) return null;
    const os=new Set([gap]); let t=0; while(os.size<4&&t++<100){ const v=gap+(Math.random()<.5?-1:1)*(5+rnd(Math.max(10,Math.round(gap*.6)))); if(v>0) os.add(v); }
    if(os.size<4) return null;
    return {kind:"Aradaki fark", q:`<strong>${esc(a.n)}</strong> ile <strong>${esc(b.n)}</strong> arasında yaklaşık kaç yıl vardır? <span class="note">(vefat yıllarına göre)</span>`, info:person(a)+person(b),
      opts:[...os].map(v=>({label:`${v} yıl`,ok:v===gap}))}; },
  tfYear(p){ const x=pick(p); const t=Math.random()<.5; let d=x.d; if(!t){ let nd; do{ nd=x.d+(Math.random()<.5?-1:1)*(3+rnd(45)); }while(nd<1||nd===x.d); d=nd; }
    return tfQ("Doğru mu?",`<strong>${esc(x.n)}</strong>, <strong>h. ${d}</strong> yılında vefat etmiştir.`,t,person(x)); },
  pair(p){ let a,b,g=0; do{ a=pick(p); b=pick(p); }while(a.d===b.d && g++<50); if(a.d===b.d) return null; const late=Math.random()<.35;
    const tg = late ? (a.d>b.d?a:b) : (a.d<b.d?a:b);
    return {kind:"Önce mi, sonra mı?", layout:"pair", q:`Hangisi <strong>daha ${late?"sonra":"önce"}</strong> vefat etmiştir?`, info:person(a)+person(b),
      opts:[a,b].map(x=>({label:x.n,ok:x===tg,after:`h. ${x.d}`}))}; }
};
function vefatMC(){ const p=vpool(); if(p.length<4) return null; for(let i=0;i<30;i++){ const g=pick(["year","year","year","cent","whichCent","earliest","gap","tfYear"]); const q=VEF[g](p);
  if(q&&(q.layout==="tf"||new Set(q.opts.map(o=>o.label)).size===q.opts.length)){ if(q.layout!=="tf") q.opts=shuffle(q.opts); return q; } } return null; }
function vefatPair(){ const p=vpool(); if(p.length<2) return null; return VEF.pair(p); }

/* --- Soru turu (tek seçimli) --- */
let Q=null;
function startQuiz(gen,len){ Q={gen,len,n:0,ok:0,cur:null,ans:null}; }
function quizHTML(){
  if(!Q.cur){ Q.cur=Q.gen(); Q.ans=null; }
  const c=Q.cur; if(!c) return tooSmall();
  const a=Q.ans, done=Q.n>=Q.len && a!==null;
  const wrap = c.layout==="tf"||c.layout==="pair" ? "tf-btns" : "opts";
  const btn = c.layout==="tf"||c.layout==="pair" ? "big" : "opt";
  return `<div class="card">
    <div class="qmeta"><span class="qkind">${esc(c.kind)}</span><span>Soru ${Math.min(Q.n+(a===null?1:0),Q.len)} / ${Q.len} · bu turda ${Q.ok} doğru</span></div>
    <p class="qtext">${c.q}</p>
    <div class="${wrap}">${c.opts.map((o,i)=>`<button class="${btn} ${a!==null?(o.ok?"ok-c":(a===i?"bad-c":"")):""}" data-qi="${i}" ${a!==null?"disabled":""}>
      ${c.layout==="tf"?"":`${i+1}. `}${esc(o.label)}${o.sub?`<span class="s">${esc(o.sub)}</span>`:""}${a!==null&&o.after?`<span class="s">${esc(o.after)}</span>`:""}</button>`).join("")}</div>
    ${a!==null?`<div class="after">
      <div class="verdict ${c.opts[a].ok?"ok":"bad"}">${c.opts[a].ok?"Bildiniz.":"Bilemediniz."}${c.layout==="tf"?` Bu ifade ${c.opts[0].ok?"doğru":"yanlış"}.`:""}</div>
      <div class="infos">${c.info||""}</div>
      <div class="row">${done?`<span class="verdict">Tur bitti: ${Q.len} soruda ${Q.ok} doğru.</span><button class="primary" id="qNew">Yeni tur</button>`:`<button class="primary" id="qNext">Sonraki soru</button>`}</div>
    </div>`:`<p class="note" style="margin-top:12px">${c.layout==="tf"?"Kısayollar: D = Doğru, Y = Yanlış":c.layout==="pair"?"Kısayollar: 1 = sol, 2 = sağ":"Kısayollar: 1–4 tuşları"}</p>`}
  </div>`;
}
function bindQuiz(){
  document.querySelectorAll("[data-qi]").forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.qi));
  const nx=$("#qNext"), nw=$("#qNew");
  if(nx){ nx.onclick=()=>{ Q.cur=null; drawView(); }; nx.focus({preventScroll:true}); }
  if(nw){ nw.onclick=()=>{ startQuiz(Q.gen,Q.len); drawView(); }; nw.focus({preventScroll:true}); }
}
function answerQuiz(i){ if(!Q||!Q.cur||Q.ans!==null) return; Q.ans=i; Q.n++; const ok=Q.cur.opts[i].ok; if(ok) Q.ok++; tally(ok); drawView(); }

/* --- Zamana karşı --- */
let S=null;
function startSpeed(gen,key){ S={gen,key,dur:60,ok:0,all:0,cur:null,started:false,end:0,missed:[],best:store.get("ho.speed."+key,0)}; }
function speedHTML(){
  if(!S.started) return `<div class="card" style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center">
      <span class="qkind">Zamana karşı</span><p class="qtext" style="margin:0">60 saniyede kaç soruyu doğru cevaplayabilirsin?</p>
      <p class="note">${S.key==="eser"?"Doğru/Yanlış soruları gelir.":"\"Hangisi daha önce/sonra vefat etti?\" soruları gelir."} Yanlış cevap seriyi bozar ama süre durmaz.</p>
      ${S.best?`<p class="note">Rekorun: <b>${S.best}</b> doğru</p>`:""}
      <button class="primary" id="spStart">Başla</button></div>`;
  const left=Math.max(0,S.end-Date.now());
  if(left<=0){
    return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="qkind" style="align-self:flex-start">Süre doldu</span>
      <div class="row" style="align-items:flex-end;gap:16px"><span class="bigstat">${S.ok}</span><span class="note">doğru · ${S.all} soru${S.ok>=S.best&&S.ok>0?" · <b>Yeni rekor!</b>":` · rekor ${S.best}`}</span></div>
      ${S.missed.length?`<p class="note">Kaçırdıkların:</p><div class="infos">${S.missed.slice(0,8).join("")}</div>`:""}
      <div class="row"><button class="primary" id="spStart">Tekrar oyna</button></div></div>`;
  }
  if(!S.cur) S.cur=S.gen();
  const c=S.cur; if(!c) return tooSmall();
  const wrap="tf-btns", btn="big";
  return `<div class="card" id="spCard">
    <div class="qmeta"><span class="qkind">${esc(c.kind)}</span><span id="spLeft">${Math.ceil(left/1000)} sn · ${S.ok} doğru</span></div>
    <div class="timer"><i id="spBar" style="width:${100*left/(S.dur*1000)}%"></i></div>
    <p class="qtext">${c.q}</p>
    <div class="${wrap}">${c.opts.map((o,i)=>`<button class="${btn}" data-si="${i}">${esc(o.label)}</button>`).join("")}</div></div>`;
}
function bindSpeed(){
  const st=$("#spStart"); if(st) st.onclick=()=>{ S.started=true; S.ok=0; S.all=0; S.missed=[]; S.cur=null; S.end=Date.now()+S.dur*1000; runTimer(); drawView(); };
  document.querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>answerSpeed(+b.dataset.si));
}
function answerSpeed(i){
  if(!S||!S.started||!S.cur||Date.now()>=S.end) return;
  const ok=S.cur.opts[i].ok; S.all++; if(ok) S.ok++; else S.missed.push(S.cur.info); tally(ok);
  S.cur=null; drawView(); const card=$("#spCard"); if(card){ card.classList.add(ok?"flash-ok":"flash-bad"); setTimeout(()=>card.classList.remove("flash-ok","flash-bad"),250); }
}
function runTimer(){
  clearInterval(speedTimer);
  speedTimer=setInterval(()=>{
    if(!S||!S.started){ clearInterval(speedTimer); return; }
    const left=S.end-Date.now();
    if(left<=0){ clearInterval(speedTimer); if(S.ok>S.best){ S.best=S.ok; store.set("ho.speed."+S.key,S.ok); } drawView(); return; }
    const l=$("#spLeft"), bar=$("#spBar"); if(l) l.textContent=`${Math.ceil(left/1000)} sn · ${S.ok} doğru`; if(bar) bar.style.width=`${100*left/(S.dur*1000)}%`;
  },200);
}

/* --- Oklarla sıralama --- */
let SO=null;
function startSort(items){ SO={items, order:shuffle(items.map((_,i)=>i)), checked:false}; if(SO.order.every((v,i)=>items[v].val>= (i?items[SO.order[i-1]].val:-1))) SO.order.reverse(); }
function sortHTML(title){
  if(!SO||SO.items.length<4) return tooSmall("Sıralama için yeterli sayıda farklı âlim yok; süzgeçten daha fazla tür veya dönem seçin.");
  const sorted=SO.items.map((x,i)=>i).sort((a,b)=>SO.items[a].val-SO.items[b].val);
  let correct=0; if(SO.checked) SO.order.forEach((v,i)=>{ if(SO.items[v].val===SO.items[sorted[i]].val) correct++; });
  return `<div class="card">
    <div class="qmeta"><span class="qkind">Sıralama</span><span>${title}</span></div>
    <p class="note" style="margin-top:10px">Okları kullanarak en önce vefat edeni en üste, en son vefat edeni en alta taşıyın.</p>
    <div class="sortlist">${SO.order.map((v,pos)=>{ const it=SO.items[v]; const ok=SO.checked?(it.val===SO.items[sorted[pos]].val):null;
      return `<div class="srow ${ok===true?"ok":ok===false?"bad":""}">
        <span class="num">${pos+1}</span>
        <div class="body"><div class="nm">${esc(it.label)}</div>${it.sub?`<div class="w">${esc(it.sub)}</div>`:""}
          ${SO.checked?`<div class="info"><span class="date">h. ${it.val}</span> · ${esc(it.info)}</div>`:""}</div>
        ${SO.checked?"":`<div class="arrows"><button class="arr" data-up="${pos}" aria-label="${esc(it.label)} yukarı taşı" ${pos===0?"disabled":""}>${UP}</button>
          <button class="arr" data-down="${pos}" aria-label="${esc(it.label)} aşağı taşı" ${pos===SO.order.length-1?"disabled":""}>${DOWN}</button></div>`}
      </div>`; }).join("")}</div>
    <div class="row" style="margin-top:14px">${SO.checked
      ?`<span class="verdict ${correct===SO.items.length?"ok":"bad"}">${correct} / ${SO.items.length} doğru yerde.</span><button class="primary" id="soNew">Yeni tur</button>`
      :`<button class="primary" id="soCheck">Kontrol et</button><button class="secondary" id="soShuf">Karıştır</button>`}</div>
    ${SO.checked&&correct!==SO.items.length?`<p class="note" style="margin-top:10px">Doğru sıra: ${sorted.map(i=>`${esc(SO.items[i].label)} (${SO.items[i].val})`).join(" → ")}</p>`:""}
  </div>`;
}
function bindSort(newFn){
  const mv=(from,to)=>{ const o=SO.order; [o[from],o[to]]=[o[to],o[from]]; drawView(); const b=document.querySelector(`[data-${to<from?"up":"down"}="${to}"]`)||document.querySelector(`[data-${to<from?"down":"up"}="${to}"]`); if(b) b.focus({preventScroll:true}); };
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const p=+b.dataset.up; if(p>0) mv(p,p-1); });
  document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{ const p=+b.dataset.down; if(p<SO.order.length-1) mv(p,p+1); });
  const ck=$("#soCheck"); if(ck) ck.onclick=()=>{ SO.checked=true; const sorted=SO.items.map((x,i)=>i).sort((a,b)=>SO.items[a].val-SO.items[b].val); SO.order.forEach((v,i)=>tally(SO.items[v].val===SO.items[sorted[i]].val)); drawView(); };
  const sh=$("#soShuf"); if(sh) sh.onclick=()=>{ SO.order=shuffle(SO.order); drawView(); };
  const nw=$("#soNew"); if(nw) nw.onclick=()=>{ newFn(); drawView(); };
}

/* --- Eşleştirme --- */
let MT=null;
function startMatch(pairs){ MT={pairs, right:shuffle(pairs.map((_,i)=>i)), done:new Set(), selL:null, selR:null, miss:0, wrong:null, t0:Date.now(), t1:0}; }
function matchHTML(lh,rh){
  if(!MT||MT.pairs.length<3) return tooSmall("Bu eşleştirme için yeterli kayıt yok; başka bir biçim veya daha çok tür seçin.");
  const fin=MT.done.size===MT.pairs.length; const secs=Math.round(((MT.t1||Date.now())-MT.t0)/1000);
  return `<div class="card">
    <div class="qmeta"><span>Soldan birini, sonra sağdan karşılığını seçin</span><span>Hata: ${MT.miss}</span></div>
    <div class="match">
      <div class="col"><h3>${lh}</h3>${MT.pairs.map((p,i)=>`<button class="tile ${MT.done.has(i)?"done":""} ${MT.selL===i?"sel":""} ${MT.wrong&&MT.wrong[0]===i?"wrong":""}" data-ml="${i}" ${MT.done.has(i)?"disabled":""}>${esc(p.left)}${p.leftSub?`<span class="s">${esc(p.leftSub)}</span>`:""}</button>`).join("")}</div>
      <div class="col"><h3>${rh}</h3>${MT.right.map(i=>`<button class="tile ${MT.done.has(i)?"done":""} ${MT.selR===i?"sel":""} ${MT.wrong&&MT.wrong[1]===i?"wrong":""}" data-mr="${i}" ${MT.done.has(i)?"disabled":""}>${esc(MT.pairs[i].right)}</button>`).join("")}</div>
    </div>
    ${fin?`<div class="after"><div class="verdict ok">Tamamlandı: ${secs} saniye, ${MT.miss} hata.</div><div class="infos">${MT.pairs.map(p=>p.info).join("")}</div>
      <div class="row"><button class="primary" id="mtNew">Yeni tur</button></div></div>`
      :`<div class="row" style="margin-top:14px"><button class="secondary" id="mtNew">Karıştır, yeni tur</button></div>`}
  </div>`;
}
function bindMatch(newFn){
  const tryM=()=>{ if(MT.selL!==null&&MT.selR!==null){ const ok=MT.selL===MT.selR; if(ok){ MT.done.add(MT.selL); tally(true); } else { MT.miss++; MT.wrong=[MT.selL,MT.selR]; tally(false); }
      MT.selL=null; MT.selR=null; if(MT.done.size===MT.pairs.length&&!MT.t1) MT.t1=Date.now(); } drawView(); };
  document.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{ MT.selL=+b.dataset.ml; MT.wrong=null; tryM(); });
  document.querySelectorAll("[data-mr]").forEach(b=>b.onclick=()=>{ MT.selR=+b.dataset.mr; MT.wrong=null; tryM(); });
  const nw=$("#mtNew"); if(nw) nw.onclick=()=>{ newFn(); drawView(); };
}

let mMode=store.get("hadis.mmode","author"); const MMODES={author:"Eser ↔ Müellif", date:"Müellif ↔ Vefat", cat:"Eser ↔ Tür", of:"Eser ↔ Konusu"}; if(!MMODES[mMode]) mMode="author";
function newEserMatch(){
  const rv=e=>mMode==="author"?aName(e.a):mMode==="date"?`h. ${aDate(e.a)}`:mMode==="cat"?CATS[e.k].s:e.of;
  const lv=e=>mMode==="date"?aName(e.a):e.t;
  let p=shuffle(pool()); if(mMode==="of") p=p.filter(e=>e.of);
  const ch=[], uL=new Set(), uR=new Set(), uK=new Set(), uA=new Set(), uG=new Set(); const manyG=new Set(p.map(x=>groupOf[x.k])).size>=5;
  for(const e of p){ const L=lv(e), R=rv(e); if(uL.has(L)||uR.has(R)||uK.has(e.key)) continue;
    if(mMode==="author"&&!unamb(e)) continue; if(mMode==="date"&&uA.has(e.a)) continue; if(mMode==="cat"&&manyG&&uG.has(groupOf[e.k])) continue;
    ch.push(e); uL.add(L); uR.add(R); uK.add(e.key); uA.add(e.a); uG.add(groupOf[e.k]); if(ch.length===5) break; }
  startMatch(ch.map(e=>({left:lv(e), leftSub:mMode==="date"?e.t:(mMode==="of"||mMode==="cat")?aName(e.a):"", right:rv(e), info:kunye(e)})));
}
function newEserSort(){
  const au=shuffle([...new Set(pool().map(e=>e.a))]); const ch=[];
  for(const a of au){ if(ch.some(b=>Math.abs(aDate(b)-aDate(a))<6)) continue; ch.push(a); if(ch.length===5) break; }
  startSort(ch.map(a=>{ const e=pick(pool().filter(x=>x.a===a)); return {label:aName(a), sub:e.t, val:aDate(a), info:e.n||CATS[e.k].s}; }));
}
function newVefatSort(){
  const ch=[]; for(const x of shuffle(vpool())){ if(ch.some(y=>Math.abs(y.d-x.d)<3)) continue; ch.push(x); if(ch.length===5) break; }
  startSort(ch.map(x=>({label:x.n, sub:"", val:x.d, info:x.note})));
}
function newVefatMatch(){
  const ch=[]; for(const x of shuffle(vpool())){ if(ch.some(y=>y.d===x.d)) continue; ch.push(x); if(ch.length===5) break; }
  startMatch(ch.map(x=>({left:x.n, leftSub:"", right:`h. ${x.d}`, info:person(x)})));
}

    if(game==="eser"){ v.innerHTML=`<div class="seg" id="mseg">${Object.entries(MMODES).map(([k,t])=>`<button data-mm="${k}" aria-pressed="${mMode===k}">${t}</button>`).join("")}</div>`+matchHTML(mMode==="date"?"Müellif":"Eser",{author:"Müellif",date:"Vefat",cat:"Tür",of:"Konusu"}[mMode]);
      document.querySelectorAll("[data-mm]").forEach(b=>b.onclick=()=>{ mMode=b.dataset.mm; store.set("hadis.mmode",mMode); newEserMatch(); drawView(); }); bindMatch(newEserMatch); }
    else { v.innerHTML=matchHTML("Âlim","Vefat"); bindMatch(newVefatMatch); }
  }
  else if(m==="flash"){ v.innerHTML=flashHTML(); bindFlash(); }
  else if(m==="type"){ v.innerHTML=typeHTML(); bindType(); }
  else if(m==="lib"){
    if(!$("#libq")){ v.innerHTML=`<div class="seg" id="lseg"><button data-lm="tur" aria-pressed="${libMode==="tur"}">Türe göre</button><button data-lm="asir" aria-pressed="${libMode==="asir"}">Asra göre</button></div>
      <input class="search" id="libq" type="search" placeholder="Eser, müellif veya konu ara (ör. Buhârî, şerh, garîb)" value="${esc(q)}" aria-label="Kütüphanede ara"><div id="libout" class="panel"></div>`;
      $("#libq").addEventListener("input",ev=>{ q=ev.target.value; $("#libout").innerHTML=libResults(); });
      document.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>{ libMode=b.dataset.lm; store.set("hadis.lib",libMode); document.querySelectorAll("[data-lm]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lm===libMode)); $("#libout").innerHTML=libResults(); }); }
    $("#libout").innerHTML=libResults();
  }
  else if(m==="list"){
    if(!$("#vlq")){ v.innerHTML=`<input class="search" id="vlq" type="search" placeholder="İsim veya eser ara (ör. Zehebî, Sünen)" value="${esc(vq2)}" aria-label="Listede ara"><div id="vlout" class="panel"></div>`;
      $("#vlq").addEventListener("input",ev=>{ vq2=ev.target.value; $("#vlout").innerHTML=vlistResults(); }); }
    $("#vlout").innerHTML=vlistResults();
  }
}
function homeHTML(){
  const book=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-2-1.5-5-2-8-1.8v12c3-.2 6 .3 8 1.8 2-1.5 5-2 8-1.8v-12C17 5 14 5.5 12 7z"/><path d="M12 7v12"/></svg>`;
  const clock=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`;
  const ds=Object.values(A).map(x=>x[1]);
  return `<section class="hero"><div class="eyebrow">Hadis ilmi · öğrenme oyunları</div><h1>Hadis Oyunları</h1>
      <p>Hadis literatürünün temel eserlerini, müelliflerini ve âlimlerin vefat yıllarını oyunlarla öğren. Her cevaptan sonra eser ya da âlim hakkında kısa bir bilgi çıkar.</p></section>
    <div class="games">
      <button class="gcard" data-go="eser"><span class="ic">${book}</span><h2>Hadis Eserleri</h2>
        <p>${ENT.length} eser, ${Object.keys(CATS).length} tür. Rivayet kaynaklarından şerhlere, usûlden ricâle; h. ${Math.min(...ds)}–${Math.max(...ds)}.</p>
        <div class="meta">${Object.values(GAMES.eser.modes).map(m=>`<span class="pill">${m}</span>`).join("")}</div><span class="go">Oyuna gir →</span></button>
      <button class="gcard" data-go="vefat"><span class="ic">${clock}</span><h2>Vefat Yılları</h2>
        <p>${V.length} âlimin hicrî vefat yılları: Ömer b. Abdülaziz'den (101) Kastallânî'ye (923).</p>
        <div class="meta">${Object.values(GAMES.vefat.modes).map(m=>`<span class="pill">${m}</span>`).join("")}</div><span class="go">Oyuna gir →</span></button>
    </div>
    <div id="installBox"></div>`;
}
function render(){
  clearInterval(speedTimer);
  const app=$("#app");
  if(game==="home"){ app.innerHTML=homeHTML(); document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go)); renderInstall(); return; }
  const G=GAMES[game];
  app.innerHTML = `<div class="ghead"><button class="back" id="backBtn">← Oyunlar</button><h2>${G.title}</h2></div>
    <nav class="modes" role="tablist">${Object.entries(G.modes).map(([k,t])=>`<button class="mode" role="tab" data-mode="${k}" aria-selected="${mode[game]===k}">${t}</button>`).join("")}</nav>
    ${game==="eser"?eserFilterHTML():vefatFilterHTML()}
    ${["lib","list"].includes(mode[game])?"":`<div class="scorebar" id="scorebar">${scoreHTML()}</div>`}
    <div id="view" class="panel"></div>`;
  $("#backBtn").onclick=()=>go("home");
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ mode[game]=b.dataset.mode; store.set("ho.m."+game,mode[game]); initMode(); render(); });
  const sel=document.querySelector(".mode[aria-selected='true']"); if(sel&&sel.scrollIntoView) sel.scrollIntoView({block:"nearest",inline:"center"});
  bindFilters();
  if((mode[game]==="speed")&&S&&S.started&&S.end>Date.now()) runTimer();
  drawView();
}
function go(g){
  if(g===game) return; game=g; if(g!=="home") initMode();
  try{ if(g==="home") history.replaceState(null,"",location.pathname+location.search); else location.hash = g==="eser"?"eserler":"vefat"; }catch(e){}
  render(); window.scrollTo({top:0});
}
function fromHash(){ const h=location.hash.replace("#",""); return h==="eserler"?"eser":h==="vefat"?"vefat":"home"; }
window.addEventListener("hashchange",()=>{ const g=fromHash(); if(g!==game){ game=g; if(g!=="home") initMode(); render(); } });
$("#brand").onclick=()=>go("home");

/* --- klavye --- */
document.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="INPUT"||game==="home") return; const k=ev.key.toLowerCase(); const m=mode[game];
  if(["tf","mc","pair"].includes(m)&&Q&&Q.cur&&Q.ans===null){
    if(Q.cur.layout==="tf"){ if(k==="d") answerQuiz(0); if(k==="y") answerQuiz(1); }
    if(/^[1-4]$/.test(k)&&+k<=Q.cur.opts.length) answerQuiz(+k-1);
  }
  if(m==="speed"&&S&&S.started&&S.cur){ if(S.cur.layout==="tf"){ if(k==="d") answerSpeed(0); if(k==="y") answerSpeed(1); } if(k==="1") answerSpeed(0); if(k==="2") answerSpeed(1); }
});

/* --- gündüz / gece --- */
const mqDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : {matches:false};
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==="dark" : mqDark.matches; }
function syncThemeBtn(){ $("#themeLbl").textContent = isDark() ? "Gündüz" : "Gece"; }
(function(){ const s=store.get("hadis.theme",null); if(s==="dark"||s==="light") document.documentElement.dataset.theme=s; })();
$("#themeBtn").onclick=()=>{ const n=isDark()?"light":"dark"; document.documentElement.dataset.theme=n; store.set("hadis.theme",n); syncThemeBtn(); };
if(mqDark.addEventListener) mqDark.addEventListener("change",syncThemeBtn);
syncThemeBtn();

/* --- telefona yükleme (yalnız GitHub Pages sürümünde) --- */
const IS_SITE = /github\.io$/.test(location.hostname);
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; renderInstall(); });
function renderInstall(){
  const box=$("#installBox"); if(!box) return;
  const standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if(!IS_SITE || standalone){ box.innerHTML=""; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  box.innerHTML = `<div class="install"><p><b>Telefona uygulama olarak yükle.</b> ${installEvt?"Tek dokunuşla ana ekrana eklenir, internetsiz de açılır.":ios?"Safari'de alttaki Paylaş düğmesine, sonra \"Ana Ekrana Ekle\"ye dokun.":"Tarayıcı menüsünden \"Ana ekrana ekle\" veya \"Uygulamayı yükle\"yi seç."}</p>
    ${installEvt?`<button class="primary" id="instBtn">Yükle</button>`:""}</div>`;
  const b=$("#instBtn"); if(b) b.onclick=async()=>{ installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; renderInstall(); };
}
if(IS_SITE && "serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }

/* --- başlat --- */
game = fromHash(); if(game!=="home") initMode();
render();

</script>
</body>
</html>
