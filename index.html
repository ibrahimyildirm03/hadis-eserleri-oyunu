<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hadis kaynakları, şerhler, usûl, ricâl ve diğer türlerden eserlerle Doğru/Yanlış, test, eşleştirme ve kronoloji oyunu.">
<title>Hadis Eserleri Oyunu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* Layout: tek sütun; üstte lacivert/kahve künye bandı, altında hap şeklinde sekmeler ve yumuşak gölgeli kartlar.
   Gündüz: krem zemin, kahve vurgu, lacivert ikincil. Gece: lacivert zemin, krem yazı, sütlü kahve vurgu. */
:root{
  --paper:#F6EFE3; --surface:#FFFBF5; --surface-2:#F0E6D6; --ink:#2A1D15; --muted:#7B6757; --line:#E6D9C6;
  --accent:#7A4A2A; --accent-ink:#FFF8EE; --accent-soft:#F1E1CD; --navy:#1E2B4D; --gold:#9C6B3C; --sel:#EEDDC7;
  --hero-bg:#1E2B4D; --hero-ink:#F6EFE3; --hero-muted:#C9BFAE; --hero-accent:#D9A877;
  --ok:#2F6B45; --ok-bg:#E3EEDD; --bad:#A23A2E; --bad-bg:#F7E0DA;
  --shadow:0 1px 2px rgba(42,29,21,.06), 0 8px 24px rgba(42,29,21,.07);
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0D1530; --surface:#152042; --surface-2:#1B2850; --ink:#F3EADB; --muted:#A8B0C8; --line:#26345E;
  --accent:#C99A6B; --accent-ink:#1B120A; --accent-soft:#2A2A45; --navy:#9FB2E0; --gold:#E2C29A; --sel:#25345F;
  --hero-bg:#3A2619; --hero-ink:#F6EFE3; --hero-muted:#D4BFA8; --hero-accent:#E6B98A;
  --ok:#86D3A4; --ok-bg:#163A35; --bad:#F2A091; --bad-bg:#3F1F2B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28); color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0D1530; --surface:#152042; --surface-2:#1B2850; --ink:#F3EADB; --muted:#A8B0C8; --line:#26345E;
  --accent:#C99A6B; --accent-ink:#1B120A; --accent-soft:#2A2A45; --navy:#9FB2E0; --gold:#E2C29A; --sel:#25345F;
  --hero-bg:#3A2619; --hero-ink:#F6EFE3; --hero-muted:#D4BFA8; --hero-accent:#E6B98A;
  --ok:#86D3A4; --ok-bg:#163A35; --bad:#F2A091; --bad-bg:#3F1F2B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px;
  transition:background-color .25s, color .25s}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Künye bandı */
header{background:var(--hero-bg);color:var(--hero-ink);border-radius:24px;padding:28px 28px 26px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  border:28px solid var(--hero-accent);opacity:.16;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-accent);font-weight:700}
h1{font-size:clamp(36px,6.4vw,56px);letter-spacing:-.01em}
.sub{color:var(--hero-muted);margin:0;max-width:64ch;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--hero-ink)}
.stat b{color:var(--hero-accent)}
.themebtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--hero-ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;position:relative;z-index:1}
.themebtn:hover{background:rgba(255,255,255,.18)}
.themebtn .dot{width:14px;height:14px;border-radius:50%;background:var(--hero-accent);box-shadow:inset -4px -2px 0 rgba(0,0,0,.25)}

/* Süzgeç */
details.filter{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 20px;box-shadow:var(--shadow)}
details.filter summary{cursor:pointer;padding:14px 0;font-weight:800;font-size:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;list-style:none}
details.filter summary::-webkit-details-marker{display:none}
details.filter summary .n{font-size:14px;font-weight:600;color:var(--muted)}
details.filter summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);margin:7px 10px 0 2px;transition:transform .2s}
details.filter summary > span:first-of-type{margin-right:auto}
details.filter[open] summary::before{transform:rotate(45deg);margin-top:4px}
.fbody{display:flex;flex-direction:column;gap:16px;padding-bottom:18px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h button{background:none;border:0;padding:0;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.linkbtn{background:var(--accent-soft);border:0;color:var(--accent);font-weight:700;padding:6px 12px;border-radius:999px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:background-color .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}

/* Sekmeler: hap şeklinde */
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;background:none;border:0;padding:9px 16px;font-size:15px;font-weight:700;color:var(--muted);border-radius:999px;white-space:nowrap;transition:background-color .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.scorebar span{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:2px}
.scorebar b{color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums;font-weight:800;line-height:1.1}
@media (max-width:560px){ .scorebar{grid-template-columns:repeat(2,1fr)} }

.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.qkind{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px}
.qtext{font-family:var(--display);font-weight:500;font-size:clamp(21px,3.4vw,28px);line-height:1.35;margin:14px 0 4px}
.qtext em{font-style:italic;color:var(--accent)}
.qtext strong{color:var(--navy);font-weight:600}
.tf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:15px;font-size:18px;font-weight:800;transition:transform .12s,border-color .15s,background-color .15s}
.opt{border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:13px 15px;font-size:16px;font-weight:600;text-align:left;line-height:1.3;overflow-wrap:anywhere;transition:transform .12s,border-color .15s}
.opt .s{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:3px}
.big:hover:not(:disabled),.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.big:disabled,.opt:disabled{cursor:default;opacity:.5}
.ok-c{background:var(--ok-bg)!important;border-color:var(--ok)!important;color:var(--ok)!important;opacity:1!important}
.bad-c{background:var(--bad-bg)!important;border-color:var(--bad)!important;color:var(--bad)!important;opacity:1!important}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 22px;font-weight:800;font-size:15px;transition:filter .15s}
.primary:hover{filter:brightness(1.08)}
.secondary{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.verdict{font-weight:800;font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

.kunye-box{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kunye-box .t{font-family:var(--display);font-size:20px;font-weight:600}
.kunye-box .x{color:var(--muted);font-size:14.5px}
.date{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:800;white-space:nowrap}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--navy);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;flex-wrap:wrap;gap:2px}
.seg button{background:none;border:0;padding:7px 14px;font-weight:700;font-size:14px;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.tile{text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;font-size:15.5px;font-weight:600;line-height:1.3;min-height:54px;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--sel)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.tile .s{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}
.tile.done .s{color:inherit;opacity:.8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.chrono{display:flex;flex-direction:column;gap:8px}
.ctile{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;transition:border-color .15s}
.ctile:hover:not(:disabled){border-color:var(--accent)}
.ctile .num{flex:0 0 34px;height:34px;border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.ctile.placed .num{background:var(--accent);border:0;color:var(--accent-ink)}
.ctile .body{min-width:0;flex:1}
.ctile .nm{font-weight:800}
.ctile .w{font-size:13.5px;color:var(--muted)}
.ctile.ok{border-color:var(--ok);background:var(--ok-bg)}
.ctile.bad{border-color:var(--bad);background:var(--bad-bg)}

.search{width:100%;padding:13px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.search::placeholder{color:var(--muted)}
.libgrp{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);font-weight:800;padding-top:22px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 20px 8px;box-shadow:var(--shadow)}
.section h3{font-size:22px;padding:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h3 span{font-family:var(--body);font-size:13px;color:var(--accent);font-weight:800;background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.section .def{color:var(--muted);font-size:14.5px;margin:4px 0 6px}
.entry{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.entry .t{font-family:var(--display);font-weight:600;font-size:18px;overflow-wrap:anywhere}
.entry .x{color:var(--muted);font-size:14.5px}
.entry .x strong{color:var(--ink)}
.empty{color:var(--muted);padding:20px 0}
.note{color:var(--muted);font-size:13.5px}
@media (max-width:560px){
  header{padding:22px 20px;border-radius:20px}
  .match{gap:8px} .tile{font-size:14.5px;padding:9px} .card{padding:18px;border-radius:18px}
  .entry{grid-template-columns:56px 1fr} .opts{grid-template-columns:1fr}
  .section{padding:4px 14px 6px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} .tile.wrong{animation:none} }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><div class="eyebrow">Sahîfe-i Hemmâm'dan Menhecü'n-nakd'e</div>
      <button class="themebtn" id="themeBtn" type="button"><span class="dot"></span><span id="themeLbl">Gece</span></button></div>
    <h1>Hadis Eserleri</h1>
    <p class="sub">Rivayet kaynakları, derlemeler, şerhler, usûl, tenkit, ricâl ve tahrîc eserleri. Her eser tek bir türde yer alır. Tarihler müelliflerin hicrî vefat yıllarıdır.</p>
    <div class="stats" id="stats"></div>
  </header>

  <details class="filter" id="filterBox">
    <summary><span>Türler ve dönemler</span><span class="n" id="poolNote"></span></summary>
    <div class="fbody">
      <div class="row"><button class="linkbtn" id="allOn">Hepsini seç</button><button class="linkbtn" id="allOff">Türleri temizle</button></div>
      <div id="groups" class="fbody" style="padding:0"></div>
      <div class="grp"><div class="grp-h"><button disabled style="cursor:default">Dönem (hicrî asır)</button></div><div class="chips" id="eras"></div></div>
    </div>
  </details>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="tf">Doğru / Yanlış</button>
    <button class="tab" role="tab" data-v="mc">Test</button>
    <button class="tab" role="tab" data-v="match">Eşleştirme</button>
    <button class="tab" role="tab" data-v="chrono">Kronoloji</button>
    <button class="tab" role="tab" data-v="lib">Kütüphane</button>
  </nav>

  <div class="scorebar" id="scorebar"></div>
  <main id="view" class="panel"></main>
</div>

const ENT = E.map((r,i)=>({i, t:r[0], a:r[1], k:r[2], of:(r[3]||{}).of, n:(r[3]||{}).n||"",
  key:r[0].replace(/\s*\(.*?\)\s*/g,"").trim()}));
ENT.forEach(e=>{ if(!A[e.a]) console.error("müellif yok:",e.a,e.t); if(!CATS[e.k]) console.error("tür yok:",e.k,e.t); });
const byKey = {}; ENT.forEach(e=>{ (byKey[e.key] ||= new Set()).add(e.a); });
const unamb = e=>byKey[e.key].size===1;
const ofClash = (a,b)=>!!(a&&b&&(a.includes(b)||b.includes(a)));

const ERAS = [
 {id:"e1", s:"1–3. asır", min:1, max:300},
 {id:"e2", s:"4–6. asır", min:301, max:600},
 {id:"e3", s:"7–9. asır", min:601, max:900},
 {id:"e4", s:"10–13. asır", min:901, max:1300},
 {id:"e5", s:"14–15. asır (modern)", min:1301, max:1500}
];
const eraOf = v=>ERAS.find(x=>v>=x.min && v<=x.max).id;

/* ---------- yardımcılar ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd = n=>Math.floor(Math.random()*n);
const pick = arr=>arr[rnd(arr.length)];
const shuffle = arr=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const aName = id=>A[id][0], aDate = id=>A[id][1];
const century = v=>Math.ceil(v/100);
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

let selected = new Set(store.get("hadis2.cats", Object.keys(CATS)).filter(k=>CATS[k]));
let eras = new Set(store.get("hadis2.eras", ERAS.map(x=>x.id)));
let view = store.get("hadis.view","tf"); if(!["tf","mc","match","chrono","lib"].includes(view)) view="tf";
const score = {ok:0, all:0, streak:0, best:store.get("hadis.best",0)};

function pool(){ return ENT.filter(e=>selected.has(e.k) && eras.has(eraOf(aDate(e.a)))); }

function kunye(e){
  return `<div class="kunye-box">
    <div class="t">${esc(e.t)}</div>
    <div>${esc(aName(e.a))} <span class="date">ö. h. ${aDate(e.a)}</span></div>
    <div class="x"><span class="tag">${esc(CATS[e.k].s)}</span>${e.of?` · Konusu: ${esc(e.of)}`:""}</div>
    ${e.n?`<div class="x">${esc(e.n)}</div>`:""}
  </div>`;
}

  const ds = Object.values(A).map(x=>x[1]);
  $("#stats").innerHTML = `<span class="stat"><b>${ENT.length}</b> eser</span><span class="stat"><b>${Object.keys(A).length}</b> müellif</span><span class="stat"><b>${Object.keys(CATS).length}</b> tür</span><span class="stat">h. <b>${Math.min(...ds)}–${Math.max(...ds)}</b></span>`;
}
function renderFilter(){
  const counts = {}; ENT.forEach(e=>counts[e.k]=(counts[e.k]||0)+1);
  $("#groups").innerHTML = GROUPS.map(g=>{
    const allOn = g.cats.every(c=>selected.has(c));
    return `<div class="grp"><div class="grp-h"><button data-g="${g.id}" title="${allOn?"Grubu kaldır":"Grubu seç"}">${esc(g.s)} ${allOn?"✓":""}</button></div>
      <div class="chips">${g.cats.map(k=>`<button class="chip" data-k="${k}" aria-pressed="${selected.has(k)}">${esc(CATS[k].s)} <span class="n">${counts[k]||0}</span></button>`).join("")}</div></div>`;
  }).join("");
  $("#eras").innerHTML = ERAS.map(x=>`<button class="chip" data-era="${x.id}" aria-pressed="${eras.has(x.id)}">${x.s} <span class="n">${ENT.filter(e=>eraOf(aDate(e.a))===x.id).length}</span></button>`).join("");
  const p = pool();
  $("#poolNote").textContent = p.length<6 ? "En az 6 eser gerekli" : `${p.length} eser seçili`;

function saveFilter(){ store.set("hadis2.cats",[...selected]); store.set("hadis2.eras",[...eras]); renderFilter(); render(); }
$("#groups").addEventListener("click",ev=>{
  const c = ev.target.closest("[data-k]"), g = ev.target.closest("[data-g]");
  if(c){ const k=c.dataset.k; selected.has(k)?selected.delete(k):selected.add(k); saveFilter(); }
  else if(g){ const grp=GROUPS.find(x=>x.id===g.dataset.g); const on=grp.cats.every(k=>selected.has(k)); grp.cats.forEach(k=>on?selected.delete(k):selected.add(k)); saveFilter(); }
});
$("#eras").addEventListener("click",ev=>{ const b=ev.target.closest("[data-era]"); if(!b) return; const id=b.dataset.era; eras.has(id)?eras.delete(id):eras.add(id); saveFilter(); });
$("#allOn").onclick=()=>{ selected=new Set(Object.keys(CATS)); eras=new Set(ERAS.map(x=>x.id)); saveFilter(); };
$("#allOff").onclick=()=>{ selected=new Set(); saveFilter(); };
$("#tabs").addEventListener("click",ev=>{ const b=ev.target.closest(".tab"); if(!b) return; view=b.dataset.v; store.set("hadis.view",view); render(true); });

function renderScore(){
  if(view==="lib"){ $("#scorebar").hidden=true; return; }
  $("#scorebar").hidden=false;
  const pct = score.all?Math.round(100*score.ok/score.all):0;
  $("#scorebar").innerHTML = `<span>Doğru<b>${score.ok} / ${score.all}</b></span><span>Başarı<b>%${pct}</b></span><span>Seri<b>${score.streak}</b></span><span>En iyi seri<b>${score.best}</b></span>`;
}
function tally(ok){
  score.all++; if(ok){score.ok++;score.streak++; if(score.streak>score.best){score.best=score.streak; store.set("hadis.best",score.best);} } else score.streak=0;
  renderScore();
}
const tooSmall = ()=>`<div class="card empty">Soru üretmek için en az 6 eser gerekiyor. "Türler ve dönemler" bölümünden daha fazla tür veya dönem seçin.</div>`;

/* ---------- Doğru / Yanlış ---------- */
function otherAuthor(e, p){
  const banned = byKey[e.key];
  let c = [...new Set(p.map(x=>x.a))].filter(a=>!banned.has(a) && Math.abs(aDate(a)-aDate(e.a))<=300);
  if(c.length<2) c = Object.keys(A).filter(a=>!banned.has(a));
  return pick(c);
}
function makeTF(){
  const p = pool(); const e = pick(p);
  const T = `<em>«${esc(e.t)}»</em>`;
  const kinds = ["author","author","date","date","cat","century","before"]; if(e.of) kinds.push("of","of");
  let kind = pick(kinds); if(kind==="author" && !unamb(e)) kind="date";
  let truth = Math.random()<0.5, text="", label="";
  if(kind==="author"){
    label="Müellif"; const who = truth?e.a:otherAuthor(e,p);
    text = `${T} adlı eseri <strong>${esc(aName(who))}</strong> yazmıştır.`;
  } else if(kind==="date"){
    label="Vefat yılı"; let d=aDate(e.a);
    if(!truth){ let nd; do{ nd = d + (Math.random()<.5?-1:1)*(8+rnd(110)); }while(nd<100 || nd===d || nd>1445); d=nd; }
    text = `${T} müellifi ${esc(aName(e.a))}, <strong>h. ${d}</strong> yılında vefat etmiştir.`;
  } else if(kind==="century"){
    label="Asır"; let c=century(aDate(e.a));
    if(!truth){ const opts=[c-2,c-1,c+1,c+2].filter(x=>x>=2 && x<=15); c=pick(opts); }
    text = `${T} müellifi ${esc(aName(e.a))}, <strong>hicrî ${c}. asırda</strong> vefat etmiştir.`;
  } else if(kind==="cat"){
    label="Tür"; let k=e.k;
    if(!truth){ k = pick(Object.keys(CATS).filter(c=>groupOf[c]!==groupOf[e.k])); }
    text = `${T}, ${esc(CATS[k].p)} biridir.`;
  } else if(kind==="of"){
    label="Konusu"; let of=e.of;
    if(!truth){ of = pick([...new Set(ENT.filter(x=>x.of && !ofClash(x.of,e.of)).map(x=>x.of))]); }
    text = `${T}, <strong>${esc(of)}</strong> üzerine yazılmış bir çalışmadır.`;
  } else {
    label="Önce / sonra";
    const others = p.filter(x=>Math.abs(aDate(x.a)-aDate(e.a))>=10);
    const o = others.length?pick(others):pick(ENT.filter(x=>Math.abs(aDate(x.a)-aDate(e.a))>=10));
    const real = aDate(e.a)<aDate(o.a);
    text = `<strong>${esc(aName(e.a))}</strong> (${esc(e.t)}), <strong>${esc(aName(o.a))}</strong> (${esc(o.t)}) adlı âlimden <strong>önce</strong> vefat etmiştir.`;
    truth = real; return {e, o, text, truth, label, answered:null};
  }
  return {e, text, truth, label, answered:null};
}
let tf=null, tfRound={n:0, ok:0, len:15};
function renderTF(){
  if(pool().length<6){ $("#view").innerHTML=tooSmall(); return; }
  if(!tf) tf = makeTF();
  const a = tf.answered, done = tfRound.n>=tfRound.len && a!==null;
  const cls = v=> a===null?"": (v===tf.truth?"ok-c":(a===v?"bad-c":""));
  $("#view").innerHTML = `<div class="card">
    <div class="qmeta"><span class="qkind">${tf.label}</span><span>Soru ${Math.min(tfRound.n+(a===null?1:0),tfRound.len)} / ${tfRound.len} · bu turda ${tfRound.ok} doğru</span></div>
    <p class="qtext">${tf.text}</p>
    <div class="tf-btns" style="margin-top:14px">
      <button class="big ${cls(true)}" id="bT" ${a!==null?"disabled":""}>Doğru</button>
      <button class="big ${cls(false)}" id="bF" ${a!==null?"disabled":""}>Yanlış</button>
    </div>
    ${a!==null?`<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
      <div class="verdict ${a===tf.truth?"ok":"bad"}">${a===tf.truth?"Bildiniz.":"Bilemediniz."} Bu ifade ${tf.truth?"doğru":"yanlış"}.</div>
      ${kunye(tf.e)}${tf.o?kunye(tf.o):""}
      <div class="row">${done
        ?`<span class="verdict">Tur bitti: ${tfRound.len} soruda ${tfRound.ok} doğru.</span><button class="primary" id="tfNew">Yeni tur</button>`
        :`<button class="primary" id="tfNext">Sonraki soru</button>`}</div>
    </div>`:`<p class="note" style="margin:12px 0 0">Kısayollar: D = Doğru, Y = Yanlış</p>`}
  </div>`;
  if(a===null){ $("#bT").onclick=()=>answerTF(true); $("#bF").onclick=()=>answerTF(false); }
  else if(done){ $("#tfNew").onclick=()=>{ tfRound={n:0,ok:0,len:15}; tf=null; renderTF(); }; $("#tfNew").focus(); }
  else { $("#tfNext").onclick=()=>{ tf=null; renderTF(); }; $("#tfNext").focus(); }
}
function answerTF(v){ if(tf.answered!==null) return; tf.answered=v; tfRound.n++; const ok=v===tf.truth; if(ok) tfRound.ok++; tally(ok); renderTF(); }
document.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="INPUT") return;
  const k=ev.key.toLowerCase();
  if(view==="tf" && tf && tf.answered===null){ if(k==="d") answerTF(true); if(k==="y") answerTF(false); }
  if(view==="mc" && mc && mc.answered===null && ["1","2","3","4"].includes(k)) answerMC(+k-1);
});

/* ---------- Test (çoktan seçmeli) ---------- */
function opt(label, sub, ok, ent){ return {label, sub, ok, ent}; }
const MCGEN = {
  author(p){ // Bu eserin müellifi kim?
    const e = pick(p.filter(unamb)); if(!e) return null;
    const banned = byKey[e.key];
    const cand = shuffle([...new Set(ENT.map(x=>x.a))].filter(a=>!banned.has(a) && Math.abs(aDate(a)-aDate(e.a))<=350)).slice(0,3);
    return {label:"Müellif", q:`<em>«${esc(e.t)}»</em> adlı eserin müellifi kimdir?`, show:[e],
      opts:[opt(aName(e.a),"",true), ...cand.map(a=>opt(aName(a),"",false))]};
  },
  date(p){ // Vefat yılı
    const e = pick(p); const d=aDate(e.a); const ds=new Set([d]); const out=[];
    let guard=0; while(out.length<3 && guard++<200){ const nd = d + (Math.random()<.5?-1:1)*(10+rnd(140)); if(nd<100||nd>1445) continue; if([...ds].some(x=>Math.abs(x-nd)<7)) continue; ds.add(nd); out.push(nd); }
    return {label:"Vefat yılı", q:`<em>«${esc(e.t)}»</em> müellifi <strong>${esc(aName(e.a))}</strong> hangi yılda vefat etmiştir?`, show:[e],
      opts:[opt(`h. ${d}`,"",true), ...out.map(x=>opt(`h. ${x}`,"",false))]};
  },
  cat(p){ // Hangi tür?
    const e = pick(p);
    const others = shuffle(GROUPS.filter(g=>g.id!==groupOf[e.k])).slice(0,3).map(g=>pick(g.cats));
    return {label:"Tür", q:`<em>«${esc(e.t)}»</em> (${esc(aName(e.a))}) hangi türdendir?`, show:[e],
      opts:[opt(CATS[e.k].s,"",true), ...others.map(k=>opt(CATS[k].s,"",false))]};
  },
  whichCat(p){ // Hangisi X türündendir?
    const cats = [...new Set(p.map(e=>e.k))]; const k = pick(cats);
    const right = pick(p.filter(e=>e.k===k));
    const wrong = shuffle(ENT.filter(e=>groupOf[e.k]!==groupOf[k])).slice(0,3);
    return {label:"Tür", q:`Aşağıdakilerden hangisi <strong>${esc(CATS[k].s.toLocaleLowerCase("tr"))}</strong> türünden bir eserdir?`, show:[right],
      opts:[opt(right.t,aName(right.a),true,right), ...wrong.map(e=>opt(e.t,aName(e.a),false,e))]};
  },
  notBy(p){ // Hangisi X'in eseri değildir?
    const counts={}; ENT.forEach(e=>{ if(unamb(e)) (counts[e.a] ||= []).push(e); });
    const prolific = [...new Set(p.map(e=>e.a))].filter(a=>(counts[a]||[]).length>=3);
    if(!prolific.length) return null;
    const a = pick(prolific); const his = shuffle(counts[a]).slice(0,3);
    const other = pick(ENT.filter(e=>unamb(e) && e.a!==a && Math.abs(aDate(e.a)-aDate(a))<=300));
    return {label:"Müellif", q:`Aşağıdakilerden hangisi <strong>${esc(aName(a))}</strong> (ö. h. ${aDate(a)}) adlı âlimin eseri <strong>değildir</strong>?`, show:[other],
      opts:[opt(other.t,"",true,other), ...his.map(e=>opt(e.t,"",false,e))]};
  },
  of(p){ // X üzerine yazılan eser hangisi?
    const withOf = p.filter(e=>e.of); if(!withOf.length) return null;
    const e = pick(withOf);
    const wrong = shuffle(ENT.filter(x=>!ofClash(x.of,e.of) && !ofClash(x.t,e.of) && x.key!==e.key)).slice(0,3);
    return {label:"Konusu", q:`Aşağıdakilerden hangisi <strong>${esc(e.of)}</strong> üzerine yazılmış bir eserdir?`, show:[e],
      opts:[opt(e.t,aName(e.a),true,e), ...wrong.map(x=>opt(x.t,aName(x.a),false,x))]};
  },
  earliest(p){ // En önce vefat eden
    const auth = shuffle([...new Set(p.map(e=>e.a))]); const chosen=[];
    for(const a of auth){ if(chosen.every(b=>Math.abs(aDate(b)-aDate(a))>=8)) chosen.push(a); if(chosen.length===4) break; }
    if(chosen.length<4) return null;
    const late = Math.random()<.5; const target = chosen.slice().sort((x,y)=>late?aDate(y)-aDate(x):aDate(x)-aDate(y))[0];
    const work = a=>pick(p.filter(e=>e.a===a));
    const ws = chosen.map(a=>work(a));
    return {label:"Kronoloji", q:`Aşağıdaki âlimlerden hangisi <strong>en ${late?"son":"önce"}</strong> vefat etmiştir?`, show:[],
      opts:ws.map(e=>opt(aName(e.a),e.t,e.a===target,e)), dates:true};
  }
};
let mc=null, mcRound={n:0, ok:0, len:10};
function makeMC(){
  const p = pool();
  for(let tries=0; tries<20; tries++){
    const g = pick(["author","author","date","cat","whichCat","notBy","of","earliest"]);
    const q = MCGEN[g](p);
    if(q && q.opts.length===4 && new Set(q.opts.map(o=>o.label)).size===4){ q.opts=shuffle(q.opts); q.answered=null; return q; }
  }
  return null;
}
function renderMC(){
  if(pool().length<6){ $("#view").innerHTML=tooSmall(); return; }
  if(!mc) mc = makeMC();
  if(!mc){ $("#view").innerHTML=tooSmall(); return; }
  const a = mc.answered, done = mcRound.n>=mcRound.len && a!==null;
  const showList = a!==null ? (mc.dates ? mc.opts.map(o=>o.ent) : mc.show) : [];
  $("#view").innerHTML = `<div class="card">
    <div class="qmeta"><span class="qkind">${mc.label}</span><span>Soru ${Math.min(mcRound.n+(a===null?1:0),mcRound.len)} / ${mcRound.len} · bu turda ${mcRound.ok} doğru</span></div>
    <p class="qtext">${mc.q}</p>
    <div class="opts" style="margin-top:14px">
      ${mc.opts.map((o,i)=>`<button class="opt ${a!==null?(o.ok?"ok-c":(a===i?"bad-c":"")):""}" data-i="${i}" ${a!==null?"disabled":""}>
        <span>${i+1}. ${esc(o.label)}${a!==null&&mc.dates?` <span class="date">h. ${aDate(o.ent.a)}</span>`:""}</span>${o.sub?`<span class="s">${esc(o.sub)}</span>`:""}</button>`).join("")}
    </div>
    ${a!==null?`<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
      <div class="verdict ${mc.opts[a].ok?"ok":"bad"}">${mc.opts[a].ok?"Bildiniz.":"Bilemediniz."}</div>
      ${showList.map(kunye).join("")}
      <div class="row">${done
        ?`<span class="verdict">Tur bitti: ${mcRound.len} soruda ${mcRound.ok} doğru.</span><button class="primary" id="mcNew">Yeni tur</button>`
        :`<button class="primary" id="mcNext">Sonraki soru</button>`}</div>
    </div>`:`<p class="note" style="margin:12px 0 0">Kısayollar: 1–4 tuşları</p>`}
  </div>`;
  if(a===null) $("#view").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>answerMC(+b.dataset.i));
  else if(done){ $("#mcNew").onclick=()=>{ mcRound={n:0,ok:0,len:10}; mc=null; renderMC(); }; $("#mcNew").focus(); }
  else { $("#mcNext").onclick=()=>{ mc=null; renderMC(); }; $("#mcNext").focus(); }
}
function answerMC(i){ if(mc.answered!==null) return; mc.answered=i; mcRound.n++; const ok=mc.opts[i].ok; if(ok) mcRound.ok++; tally(ok); renderMC(); }

/* ---------- Eşleştirme ---------- */
let mt=null, mMode=store.get("hadis.mmode","author");
const MMODES = {author:"Eser ↔ Müellif", date:"Müellif ↔ Vefat", cat:"Eser ↔ Tür", of:"Eser ↔ Konusu"};
if(!MMODES[mMode]) mMode="author";
function rightVal(e){ return mMode==="author"?aName(e.a): mMode==="date"?`h. ${aDate(e.a)}`: mMode==="cat"?CATS[e.k].s: e.of; }
function leftVal(e){ return mMode==="date"?aName(e.a):e.t; }
function leftSub(e){ return mMode==="date"?e.t: (mMode==="of"||mMode==="cat")?aName(e.a):""; }
function makeMatch(){
  let p = shuffle(pool()); if(mMode==="of") p = p.filter(e=>e.of);
  const chosen=[], usedL=new Set(), usedR=new Set(), usedKey=new Set(), usedA=new Set(), usedG=new Set();
  for(const e of p){
    const L=leftVal(e), R=rightVal(e);
    if(usedL.has(L)||usedR.has(R)||usedKey.has(e.key)) continue;
    if(mMode==="author" && !unamb(e)) continue;
    if(mMode==="date" && usedA.has(e.a)) continue;
    if(mMode==="cat" && usedG.has(groupOf[e.k]) && new Set(p.map(x=>groupOf[x.k])).size>=5) continue; // türler farklı gruplardan
    chosen.push(e); usedL.add(L); usedR.add(R); usedKey.add(e.key); usedA.add(e.a); usedG.add(groupOf[e.k]);
    if(chosen.length===5) break;
  }
  return {items:chosen, right:shuffle(chosen.map(e=>e.i)), done:new Set(), selL:null, selR:null, miss:0, wrong:null, t0:Date.now()};
}
function renderMatch(){
  const seg = `<div class="row"><div class="seg" id="mseg">${Object.entries(MMODES).map(([k,v])=>`<button data-m="${k}" aria-pressed="${mMode===k}">${v}</button>`).join("")}</div></div>`;
  if(pool().length<6){ $("#view").innerHTML=seg+tooSmall(); bindSeg(); return; }
  if(!mt) mt = makeMatch();
  if(mt.items.length<3){ $("#view").innerHTML=seg+`<div class="card empty">Seçili türlerde bu eşleştirme biçimi için yeterli eser yok. Başka bir biçim veya daha çok tür seçin.</div>`; bindSeg(); return; }
  const byI = Object.fromEntries(mt.items.map(e=>[e.i,e]));
  const finished = mt.done.size===mt.items.length;
  const secs = Math.round(((mt.t1||Date.now())-mt.t0)/1000);
  $("#view").innerHTML = seg + `<div class="card">
    <div class="qmeta"><span>Soldan birini, sonra sağdan karşılığını seçin</span><span>Hata: ${mt.miss}</span></div>
    <div class="match" style="margin-top:12px">
      <div class="col"><h3>${mMode==="date"?"Müellif":"Eser"}</h3>
        ${mt.items.map(e=>`<button class="tile ${mt.done.has(e.i)?"done":""} ${mt.selL===e.i?"sel":""} ${mt.wrong&&mt.wrong[0]===e.i?"wrong":""}" data-l="${e.i}" ${mt.done.has(e.i)?"disabled":""}>${esc(leftVal(e))}${leftSub(e)?`<span class="s">${esc(leftSub(e))}</span>`:""}</button>`).join("")}
      </div>
      <div class="col"><h3>${{author:"Müellif",date:"Vefat",cat:"Tür",of:"Konusu"}[mMode]}</h3>
        ${mt.right.map(i=>`<button class="tile ${mt.done.has(i)?"done":""} ${mt.selR===i?"sel":""} ${mt.wrong&&mt.wrong[1]===i?"wrong":""}" data-r="${i}" ${mt.done.has(i)?"disabled":""}>${esc(rightVal(byI[i]))}</button>`).join("")}
      </div>
    </div>
    ${finished?`<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
      <div class="verdict ok">Tamamlandı: ${secs} saniye, ${mt.miss} hata.</div>
      <div style="display:flex;flex-direction:column;gap:10px">${mt.items.map(kunye).join("")}</div>
      <div class="row"><button class="primary" id="mNew">Yeni tur</button></div></div>`
      :`<div class="row" style="margin-top:14px"><button class="secondary" id="mNew">Karıştır, yeni tur</button></div>`}
  </div>`;
  bindSeg();
  $("#mNew").onclick=()=>{ mt=null; renderMatch(); };
  $("#view").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ mt.selL=+b.dataset.l; mt.wrong=null; tryMatch(); });
  $("#view").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ mt.selR=+b.dataset.r; mt.wrong=null; tryMatch(); });
}
function bindSeg(){ $("#mseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ mMode=b.dataset.m; store.set("hadis.mmode",mMode); mt=null; renderMatch(); }); }
function tryMatch(){
  if(mt.selL!==null && mt.selR!==null){
    const ok = mt.selL===mt.selR;
    if(ok){ mt.done.add(mt.selL); tally(true); } else { mt.miss++; mt.wrong=[mt.selL,mt.selR]; tally(false); }
    mt.selL=null; mt.selR=null;
    if(mt.done.size===mt.items.length && !mt.t1) mt.t1=Date.now();
  }
  renderMatch();
}

/* ---------- Kronoloji ---------- */
let ch=null;
function makeChrono(){
  const authors = shuffle([...new Set(pool().map(e=>e.a))]); const chosen=[];
  for(const a of authors){ if(chosen.some(b=>Math.abs(aDate(b)-aDate(a))<6)) continue; chosen.push(a); if(chosen.length===5) break; }
  return {list:chosen.map(a=>({a, w:pick(pool().filter(e=>e.a===a)).t})), order:[], checked:false};
}
function renderChrono(){
  if(!ch) ch = makeChrono();
  if(ch.list.length<4){ $("#view").innerHTML=`<div class="card empty">Kronoloji için yeterli sayıda farklı müellif yok; daha çok tür veya dönem seçin.</div>`; return; }
  const sorted = ch.list.slice().sort((x,y)=>aDate(x.a)-aDate(y.a)).map(x=>x.a);
  const full = ch.order.length===ch.list.length;
  let correct=0; if(ch.checked) ch.order.forEach((a,i)=>{ if(aDate(a)===aDate(sorted[i])) correct++; });
  const shown = ch.checked ? ch.order.map(a=>ch.list.find(x=>x.a===a)) : ch.list;
  $("#view").innerHTML = `<div class="card">
    <div class="qmeta"><span>Müellifleri vefat sırasına göre, en eskiden başlayarak seçin</span><span>${ch.order.length} / ${ch.list.length}</span></div>
    <div class="chrono" style="margin-top:12px">
      ${shown.map(x=>{ const pos=ch.order.indexOf(x.a); const okp = ch.checked ? aDate(x.a)===aDate(sorted[pos]) : null;
        return `<button class="ctile ${pos>=0?"placed":""} ${okp===true?"ok":okp===false?"bad":""}" data-a="${x.a}" ${ch.checked?"disabled":""}>
          <span class="num">${pos>=0?pos+1:""}</span>
          <span class="body"><span class="nm">${esc(aName(x.a))}</span><br><span class="w">${esc(x.w)}</span></span>
          ${ch.checked?`<span class="date">h. ${aDate(x.a)}</span>`:""}</button>`; }).join("")}
    </div>
    <div class="row" style="margin-top:14px">
      ${ch.checked
        ?`<span class="verdict ${correct===ch.list.length?"ok":"bad"}">${correct} / ${ch.list.length} doğru sırada.</span><button class="primary" id="cNew">Yeni tur</button>`
        :`<button class="primary" id="cCheck" ${full?"":"disabled"} style="${full?"":"opacity:.5"}">Kontrol et</button><button class="secondary" id="cReset">Sıfırla</button><span class="note">Yanlış seçtiyseniz numaralı karta tekrar dokunun.</span>`}
    </div>
    ${ch.checked?`<p class="note" style="margin:12px 0 0">Doğru sıra: ${sorted.map(a=>`${esc(aName(a))} (${aDate(a)})`).join(" → ")}</p>`:""}
  </div>`;
  if(ch.checked){ $("#cNew").onclick=()=>{ ch=null; renderChrono(); }; return; }
  $("#view").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ const a=b.dataset.a, pos=ch.order.indexOf(a); if(pos>=0) ch.order=ch.order.slice(0,pos); else ch.order.push(a); renderChrono(); });
  $("#cReset").onclick=()=>{ ch.order=[]; renderChrono(); };
  $("#cCheck").onclick=()=>{ if(!full) return; ch.checked=true; ch.order.forEach((a,i)=>tally(aDate(a)===aDate(sorted[i]))); renderChrono(); };
}

/* ---------- Kütüphane ---------- */
let q="", libMode=store.get("hadis.lib","tur");
const norm = s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[ʿʾ'’`]/g,"");
function entryHTML(e){ return `<div class="entry"><div class="date">h. ${aDate(e.a)}</div><div class="body">
  <div class="t">${esc(e.t)}</div>
  <div class="x"><strong>${esc(aName(e.a))}</strong>${libMode==="asir"?` · <span class="tag">${esc(CATS[e.k].s)}</span>`:""}${e.of?` · Konusu: ${esc(e.of)}`:""}</div>
  ${e.n?`<div class="x">${esc(e.n)}</div>`:""}</div></div>`; }
function renderLib(keepFocus){
  const nq = norm(q);
  const list = pool().filter(e=>!nq || norm(`${e.t} ${aName(e.a)} ${e.of||""} ${e.n} ${CATS[e.k].s}`).includes(nq))
    .sort((x,y)=>aDate(x.a)-aDate(y.a) || x.t.localeCompare(y.t,"tr"));
  let html="";
  if(libMode==="tur"){
    html = GROUPS.map(g=>{
      const secs = g.cats.map(k=>{ const items=list.filter(e=>e.k===k); if(!items.length) return "";
        return `<section class="section"><h3>${esc(CATS[k].s)} <span>${items.length} eser</span></h3><p class="def">${esc(CATS[k].d)}</p>${items.map(entryHTML).join("")}</section>`; }).join("");
      return secs?`<div class="libgrp">${esc(g.s)}</div>${secs}`:"";
    }).join("");
  } else {
    const groups={}; list.forEach(e=>{ (groups[century(aDate(e.a))] ||= []).push(e); });
    html = Object.keys(groups).sort((a,b)=>a-b).map(c=>`<section class="section"><h3>Hicrî ${c}. asır <span>${groups[c].length} eser</span></h3>${groups[c].map(entryHTML).join("")}</section>`).join("");
  }
  if(!keepFocus){
    $("#view").innerHTML = `<div class="row"><div class="seg" id="lseg"><button data-l="tur" aria-pressed="${libMode==="tur"}">Türe göre</button><button data-l="asir" aria-pressed="${libMode==="asir"}">Asra göre</button></div></div>
      <input class="search" id="libq" type="search" placeholder="Eser, müellif veya konu ara (ör. Buhârî, şerh, garîb)" value="${esc(q)}" aria-label="Kütüphanede ara"><div id="libout"></div>`;
    $("#libq").addEventListener("input",ev=>{ q=ev.target.value; renderLib(true); });
    $("#lseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ libMode=b.dataset.l; store.set("hadis.lib",libMode); renderLib(); });
  }
  $("#libout").innerHTML = html || `<div class="empty">Aramanızla eşleşen eser yok. Seçili türleri ya da arama kelimesini değiştirin.</div>`;
}

/* ---------- genel ---------- */
function render(tabChange){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.v===view));
  renderScore();
  if(!tabChange){ tf=null; mc=null; mt=null; ch=null; }
  ({tf:renderTF, mc:renderMC, match:renderMatch, chrono:renderChrono, lib:()=>renderLib()})[view]();
}
/* ---------- gündüz / gece ---------- */
const mqDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : {matches:false};
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==="dark" : mqDark.matches; }
function syncThemeBtn(){ $("#themeLbl").textContent = isDark() ? "Gündüz" : "Gece"; }
(function(){ const saved = store.get("hadis.theme", null); if(saved==="dark"||saved==="light") document.documentElement.dataset.theme = saved; })();
$("#themeBtn").onclick = ()=>{ const next = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("hadis.theme", next); syncThemeBtn(); };
if(mqDark.addEventListener) mqDark.addEventListener("change", syncThemeBtn);
syncThemeBtn();

renderStats(); renderFilter(); render();
</script>
