<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hadis kaynakları, şerhler, usûl, ricâl ve diğer türlerden eserlerle Doğru/Yanlış, eşleştirme ve kronoloji oyunu.">
<title>Hadis Eserleri Oyunu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
html{color-scheme:light dark} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* Layout: tek sütun "defter" — üstte kunye-box ve tür süzgeci, altta sekmeli oyun alanı; kütüphane hicrî asırlara göre gruplu */
:root{
  --paper:#EEF2EE; --surface:#FFFFFF; --ink:#18241F; --muted:#5A6962; --line:#D3DCD6;
  --accent:#1D6455; --accent-ink:#FFFFFF; --gold:#8E6A17; --sel:#D8EAE3;
  --ok:#2A7A4B; --ok-bg:#DFF1E5; --bad:#B0343A; --bad-bg:#F8E0E0;
  --display:"Alegreya", "Iowan Old Style", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1613; --surface:#17201C; --ink:#E3EAE5; --muted:#98A79F; --line:#2B3732;
  --accent:#5CBFA4; --accent-ink:#0B1411; --gold:#D8B45C; --sel:#1E3A32;
  --ok:#6FCC92; --ok-bg:#163223; --bad:#EF8B8F; --bad-bg:#3B1C1F; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0F1613; --surface:#17201C; --ink:#E3EAE5; --muted:#98A79F; --line:#2B3732;
  --accent:#5CBFA4; --accent-ink:#0B1411; --gold:#D8B45C; --sel:#1E3A32;
  --ok:#6FCC92; --ok-bg:#163223; --bad:#EF8B8F; --bad-bg:#3B1C1F; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:clamp(34px,6vw,50px);font-weight:700}
.sub{color:var(--muted);margin:0;max-width:62ch}
.stats{font-variant-numeric:tabular-nums}

.filter{display:flex;flex-direction:column;gap:10px}
.filter-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.filter-head h2{font-size:20px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:2px 4px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-size:16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.scorebar{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.scorebar b{color:var(--ink);font-size:18px}

.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:clamp(21px,3.4vw,27px);line-height:1.35;margin:12px 0 4px}
.qtext em{font-style:italic;color:var(--accent)}
.tf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-size:19px;font-weight:700}
.big:hover:not(:disabled){border-color:var(--accent)}
.big:disabled{cursor:default;opacity:.55}
.big.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);opacity:1}
.big.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);opacity:1}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 20px;font-weight:700;font-size:16px}
.secondary{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.verdict{font-weight:700;font-size:18px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

.kunye-box{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.kunye-box .t{font-family:var(--display);font-size:20px;font-weight:700}
.kunye-box .m{color:var(--ink)}
.kunye-box .x{color:var(--muted);font-size:15px}
.date{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

/* Eşleştirme */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;padding:7px 14px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-family:var(--body);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.3;min-height:52px;overflow-wrap:anywhere}
.tile.sel{border-color:var(--accent);background:var(--sel)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.tile .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tile.done .s{color:inherit;opacity:.8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Kronoloji */
.chrono{display:flex;flex-direction:column;gap:8px}
.ctile{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.ctile .num{flex:0 0 34px;height:34px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.ctile.placed .num{background:var(--accent);border:0;color:var(--accent-ink)}
.ctile .body{min-width:0;flex:1}
.ctile .nm{font-weight:700}
.ctile .w{font-size:14px;color:var(--muted)}
.ctile.ok{border-color:var(--ok);background:var(--ok-bg)}
.ctile.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Kütüphane */
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.century{display:flex;flex-direction:column;gap:0}
.century h3{font-size:22px;padding:18px 0 6px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.century h3 span{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:500}
.entry{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.entry .t{font-family:var(--display);font-weight:700;font-size:18px;overflow-wrap:anywhere}
.entry .x{color:var(--muted);font-size:15px}
.empty{color:var(--muted);padding:20px 0}
.note{color:var(--muted);font-size:14px}
@media (max-width:560px){
  .match{grid-template-columns:1fr 1fr;gap:8px}
  .tile{font-size:15px;padding:9px}
  .card{padding:16px}
  .entry{grid-template-columns:56px 1fr}
}
@media (prefers-reduced-motion: reduce){ .tile.wrong{animation:none} }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Sahîfe-i Hemmâm'dan Fihrisü'l-fehâris'e</div>
    <h1>Hadis Eserleri</h1>
    <p class="sub">Hadis kaynakları, şerhler, usûl, ricâl ve cerh-ta'dîl, ilel, mevzûât, garîb, tahrîc ve daha fazlası. Tarihler müelliflerin hicrî vefat yıllarıdır. <span class="stats" id="stats"></span></p>
  </header>

  <section class="filter" aria-labelledby="fh">
    <div class="filter-head">
      <h2 id="fh">Hangi türlerden sorulsun?</h2>
      <div class="row"><button class="linkbtn" id="allOn">Tümünü seç</button><button class="linkbtn" id="allOff">Temizle</button></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="note" id="poolNote"></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="tf">Doğru / Yanlış</button>
    <button class="tab" role="tab" data-v="match">Eşleştirme</button>
    <button class="tab" role="tab" data-v="chrono">Kronoloji</button>
    <button class="tab" role="tab" data-v="lib">Kütüphane</button>
  </nav>

  <div class="scorebar" id="scorebar"></div>
  <main id="view" class="panel"></main>
</div>

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd = n=>Math.floor(Math.random()*n);
const pick = arr=>arr[rnd(arr.length)];
const shuffle = arr=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const aName = id=>A[id][0], aDate = id=>A[id][1];
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },

}

function renderScore(){
  if(view==="lib"){ $("#scorebar").hidden=true; return; }
  $("#scorebar").hidden=false;
  const pct = score.all?Math.round(100*score.ok/score.all):0;
  $("#scorebar").innerHTML = `<span>Doğru <b>${score.ok}</b> / ${score.all}</span><span>Başarı <b>%${pct}</b></span><span>Seri <b>${score.streak}</b></span><span>En iyi seri <b>${score.best}</b></span>`;
}
function tally(ok){
  score.all++; if(ok){score.ok++;score.streak++; if(score.streak>score.best){score.best=score.streak; store.set("hadis.best",score.best);} } else score.streak=0;
  renderScore();
}

/* ---------- Doğru / Yanlış ---------- */
let tf = null;
function makeTF(){
  const p = pool(); const e = pick(p);
  const types = ["author","author","date","date","cat"]; if(e.of) types.push("of","of");
  const type = pick(types); let truth = Math.random()<0.5; let text="";
  const T = `<em>«${esc(e.t)}»</em>`;
  if(type==="author"){
    let who = e.a;
    if(!truth){
      const banned = byKey[e.key];
      let cands = [...new Set(p.filter(x=>x.k===e.k).map(x=>x.a))].filter(a=>!banned.has(a));
      if(cands.length<2) cands = Object.keys(A).filter(a=>!banned.has(a));
      // yakın dönemden seçmeyi tercih et
      const near = cands.filter(a=>Math.abs(aDate(a)-aDate(e.a))<=250);
      who = pick(near.length?near:cands);
    }
    text = `${T} adlı eseri <strong>${esc(aName(who))}</strong> yazmıştır.`;
  } else if(type==="date"){
    let d = aDate(e.a);
    if(!truth){ let nd; do{ nd = d + (Math.random()<.5?-1:1)*(8+rnd(110)); }while(nd<100 || nd===d); d = nd; }
    text = `${T} müellifi ${esc(aName(e.a))}, <strong>h. ${d}</strong> yılında vefat etmiştir.`;
  } else if(type==="cat"){
    let k = e.k;
    if(!truth){ k = pick(Object.keys(CATS).filter(c=>c!==e.k && !e.alt.includes(c))); }
    text = `${T}, ${esc(CATS[k].p)} biridir.`;
  } else {
    let of = e.of;
    if(!truth){ const ofs=[...new Set(ENT.filter(x=>x.of && x.of!==e.of).map(x=>x.of))]; of = pick(ofs); }
    text = `${T}, <strong>${esc(of)}</strong> üzerine yazılmış bir çalışmadır.`;
  }
  return {e, text, truth, answered:null};
}
let tfRound = {n:0, ok:0, len:15};
function renderTF(){
  if(pool().length<6){ $("#view").innerHTML=`<div class="card empty">Soru üretmek için yukarıdan en az 6 eser içeren türler seçin.</div>`; return; }
  if(!tf) tf = makeTF();
  const a = tf.answered;
  const roundDone = tfRound.n>=tfRound.len && a!==null;
  $("#view").innerHTML = `<div class="card">
    <div class="qmeta"><span>Soru ${Math.min(tfRound.n+(a===null?1:0),tfRound.len)} / ${tfRound.len}</span><span>Bu turda ${tfRound.ok} doğru</span></div>
    <p class="qtext">${tf.text}</p>
    <div class="tf-btns" style="margin-top:14px">
      <button class="big ${a!==null?(tf.truth?"ok":(a===true?"bad":"")):""}" id="bT" ${a!==null?"disabled":""}>Doğru</button>
      <button class="big ${a!==null?(!tf.truth?"ok":(a===false?"bad":"")):""}" id="bF" ${a!==null?"disabled":""}>Yanlış</button>
    </div>
    ${a!==null?`<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
      <div class="verdict ${a===tf.truth?"ok":"bad"}">${a===tf.truth?"Bildiniz.":"Bilemediniz."} Bu ifade ${tf.truth?"doğru":"yanlış"}.</div>
      ${kunye(tf.e)}
      <div class="row">${roundDone
        ?`<span class="verdict">Tur bitti: ${tfRound.len} soruda ${tfRound.ok} doğru.</span><button class="primary" id="tfNew">Yeni tur</button>`
        :`<button class="primary" id="tfNext">Sonraki soru</button><span class="note">Kısayollar: D / Y, sonra Enter</span>`}</div>
    </div>`:`<p class="note" style="margin:12px 0 0">Kısayollar: D = Doğru, Y = Yanlış</p>`}
  </div>`;
  if(a===null){ $("#bT").onclick=()=>answerTF(true); $("#bF").onclick=()=>answerTF(false); }
  else if(roundDone){ $("#tfNew").onclick=()=>{ tfRound={n:0,ok:0,len:15}; tf=null; renderTF(); }; $("#tfNew").focus(); }
  else { $("#tfNext").onclick=()=>{ tf=null; renderTF(); }; $("#tfNext").focus(); }
}
function answerTF(v){ if(tf.answered!==null) return; tf.answered=v; tfRound.n++; const ok=v===tf.truth; if(ok) tfRound.ok++; tally(ok); renderTF(); }
document.addEventListener("keydown",ev=>{
  if(view!=="tf" || !tf || ev.target.tagName==="INPUT") return;
  const k=ev.key.toLowerCase();
  if(tf.answered===null){ if(k==="d") answerTF(true); if(k==="y") answerTF(false); }
});

let mt = null; let mMode = store.get("hadis.mmode","author");
const MMODES = {author:"Eser ↔ Müellif", date:"Müellif ↔ Vefat", cat:"Eser ↔ Tür", of:"Eser ↔ Konusu"};
function rightVal(e){ return mMode==="author"?aName(e.a): mMode==="date"?`h. ${aDate(e.a)}`: mMode==="cat"?CATS[e.k].s: e.of; }
function leftVal(e){ return mMode==="date"?aName(e.a):e.t; }
function leftSub(e){ return mMode==="date"?e.t: mMode==="cat"?"":(mMode==="of"?aName(e.a):""); }
function makeMatch(){
  let p = shuffle(pool()); if(mMode==="of") p = p.filter(e=>e.of);
  const chosen=[], usedL=new Set(), usedR=new Set(), usedKey=new Set(), usedA=new Set();
  for(const e of p){
    const L=leftVal(e), R=rightVal(e);
    if(usedL.has(L)||usedR.has(R)||usedKey.has(e.key)) continue;
    if(mMode!=="date" && mMode!=="author" && false) continue;
    if(mMode==="date" && usedA.has(e.a)) continue;
    chosen.push(e); usedL.add(L); usedR.add(R); usedKey.add(e.key); usedA.add(e.a);
    if(chosen.length===5) break;
  }
  return {items:chosen, right:shuffle(chosen.map(e=>e.i)), done:new Set(), selL:null, selR:null, miss:0, wrong:null, t0:Date.now()};
}
function renderMatch(){
  const seg = `<div class="row"><div class="seg" id="mseg">${Object.entries(MMODES).map(([k,v])=>`<button data-m="${k}" aria-pressed="${mMode===k}">${v}</button>`).join("")}</div></div>`;
  if(pool().length<6){ $("#view").innerHTML=seg+`<div class="card empty">Eşleştirme için yukarıdan daha fazla tür seçin.</div>`; bindSeg(); return; }
  if(!mt) mt = makeMatch();
  if(mt.items.length<3){ $("#view").innerHTML=seg+`<div class="card empty">Bu türlerde bu eşleştirme biçimi için yeterli farklı eser yok. Başka bir biçim veya daha çok tür seçin.</div>`; bindSeg(); return; }
  const byI = Object.fromEntries(mt.items.map(e=>[e.i,e]));
  const finished = mt.done.size===mt.items.length;
  const secs = Math.round(((mt.t1||Date.now())-mt.t0)/1000);
  $("#view").innerHTML = seg + `<div class="card">
    <div class="qmeta"><span>Soldan birini, sonra sağdan karşılığını seçin</span><span>Hata: ${mt.miss}</span></div>
    <div class="match" style="margin-top:12px">
      <div class="col"><h3>${mMode==="date"?"Müellif":"Eser"}</h3>
        ${mt.items.map(e=>`<button class="tile ${mt.done.has(e.i)?"done":""} ${mt.selL===e.i?"sel":""} ${mt.wrong&&mt.wrong[0]===e.i?"wrong":""}" data-l="${e.i}" ${mt.done.has(e.i)?"disabled":""}>${esc(leftVal(e))}${leftSub(e)?`<span class="s">${esc(leftSub(e))}</span>`:""}</button>`).join("")}
      </div>
      <div class="col"><h3>${{author:"Müellif",date:"Vefat",cat:"Tür",of:"Konusu"}[mMode]}</h3>
        ${mt.right.map(i=>`<button class="tile ${mt.done.has(i)?"done":""} ${mt.selR===i?"sel":""} ${mt.wrong&&mt.wrong[1]===i?"wrong":""}" data-r="${i}" ${mt.done.has(i)?"disabled":""}>${esc(rightVal(byI[i]))}${mt.done.has(i)&&mMode!=="date"&&mMode!=="author"?"":""}</button>`).join("")}
      </div>
    </div>
    ${finished?`<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
      <div class="verdict ok">Tamamlandı: ${secs} saniye, ${mt.miss} hata.</div>
      <div style="display:flex;flex-direction:column;gap:10px">${mt.items.map(kunye).join("")}</div>
      <div class="row"><button class="primary" id="mNew">Yeni tur</button></div></div>`
      :`<div class="row" style="margin-top:14px"><button class="secondary" id="mNew">Karıştır, yeni tur</button></div>`}
  </div>`;
  bindSeg();
  $("#mNew").onclick=()=>{ mt=null; renderMatch(); };
  $("#view").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ mt.selL=+b.dataset.l; mt.wrong=null; tryMatch(); });
  $("#view").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ mt.selR=+b.dataset.r; mt.wrong=null; tryMatch(); });
}
function bindSeg(){ $("#mseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ mMode=b.dataset.m; store.set("hadis.mmode",mMode); mt=null; renderMatch(); }); }
function tryMatch(){
  if(mt.selL!==null && mt.selR!==null){
    const L = ENT[mt.selL], R = ENT[mt.selR];
    const ok = mt.selL===mt.selR || rightVal(L)===rightVal(R);
    if(ok){ mt.done.add(mt.selL); if(mt.selL!==mt.selR){ /* aynı değer: ikisini de kapat */ mt.done.add(mt.selR);} tally(true); }
    else { mt.miss++; mt.wrong=[mt.selL,mt.selR]; tally(false); }
    mt.selL=null; mt.selR=null;
    if(mt.done.size===mt.items.length && !mt.t1) mt.t1=Date.now();
  }
  renderMatch();
}

/* ---------- Kronoloji ---------- */
let ch = null;
function makeChrono(){
  const authors = shuffle([...new Set(pool().map(e=>e.a))]);
  const chosen=[]; const dates=new Set();
  for(const a of authors){ const d=aDate(a); if([...dates].some(x=>Math.abs(x-d)<6)) continue; chosen.push(a); dates.add(d); if(chosen.length===5) break; }
  const work = a=>{ const ws=pool().filter(e=>e.a===a); return pick(ws).t; };
  return {list:chosen.map(a=>({a, w:work(a)})), order:[], checked:false};
}
function renderChrono(){
  if(!ch) ch = makeChrono();
  if(ch.list.length<4){ $("#view").innerHTML=`<div class="card empty">Kronoloji için yeterli sayıda farklı müellif yok; daha çok tür seçin.</div>`; return; }
  const sorted = ch.list.slice().sort((x,y)=>aDate(x.a)-aDate(y.a)).map(x=>x.a);
  const full = ch.order.length===ch.list.length;
  let correct = 0; if(ch.checked) ch.order.forEach((a,i)=>{ if(aDate(a)===aDate(sorted[i])) correct++; });
  const shown = ch.checked ? ch.order.map(a=>ch.list.find(x=>x.a===a)) : ch.list;
  $("#view").innerHTML = `<div class="card">
    <div class="qmeta"><span>Müellifleri vefat sırasına göre, en eskiden başlayarak seçin</span><span>${ch.order.length} / ${ch.list.length}</span></div>
    <div class="chrono" style="margin-top:12px">
      ${shown.map(x=>{ const pos=ch.order.indexOf(x.a); const okp = ch.checked ? aDate(x.a)===aDate(sorted[pos]) : null;
        return `<button class="ctile ${pos>=0?"placed":""} ${okp===true?"ok":okp===false?"bad":""}" data-a="${x.a}" ${ch.checked?"disabled":""}>
          <span class="num">${pos>=0?pos+1:""}</span>
          <span class="body"><span class="nm">${esc(aName(x.a))}</span><br><span class="w">${esc(x.w)}</span></span>
          ${ch.checked?`<span class="date">h. ${aDate(x.a)}</span>`:""}
        </button>`; }).join("")}
    </div>
    <div class="row" style="margin-top:14px">
      ${ch.checked
        ?`<span class="verdict ${correct===ch.list.length?"ok":"bad"}">${correct} / ${ch.list.length} doğru sırada.</span><button class="primary" id="cNew">Yeni tur</button>`
        :`<button class="primary" id="cCheck" ${full?"":"disabled"} style="${full?"":"opacity:.5"}">Kontrol et</button><button class="secondary" id="cReset">Sıfırla</button><span class="note">Yanlış seçtiyseniz numaralı karta tekrar dokunun.</span>`}
    </div>
    ${ch.checked?`<p class="note" style="margin:12px 0 0">Doğru sıra: ${sorted.map(a=>`${esc(aName(a))} (${aDate(a)})`).join(" → ")}</p>`:""}
  </div>`;
  if(ch.checked){ $("#cNew").onclick=()=>{ ch=null; renderChrono(); }; return; }
  $("#view").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a; const pos=ch.order.indexOf(a);
    if(pos>=0) ch.order=ch.order.slice(0,pos); else ch.order.push(a);
    renderChrono();
  });
  $("#cReset").onclick=()=>{ ch.order=[]; renderChrono(); };
  $("#cCheck").onclick=()=>{ if(!full) return; ch.checked=true;
    ch.order.forEach((a,i)=>tally(aDate(a)===aDate(sorted[i]))); renderChrono(); };
}

/* ---------- Kütüphane ---------- */
let q = "";
const norm = s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[ʿʾ'’`]/g,"");
function renderLib(keepFocus){
  const nq = norm(q);
  const list = pool().filter(e=>!nq || norm(`${e.t} ${aName(e.a)} ${e.of||""} ${e.n} ${CATS[e.k].s}`).includes(nq))
    .sort((x,y)=>aDate(x.a)-aDate(y.a) || x.t.localeCompare(y.t,"tr"));
  const groups = {}; list.forEach(e=>{ const c=Math.ceil(aDate(e.a)/100); (groups[c] ||= []).push(e); });
  const html = Object.keys(groups).sort((a,b)=>a-b).map(c=>`<section class="century">
      <h3>Hicrî ${c}. asır <span>${groups[c].length} eser</span></h3>
      ${groups[c].map(e=>`<div class="entry"><div class="date">h. ${aDate(e.a)}</div><div class="body">
        <div class="t">${esc(e.t)}</div>
        <div class="x"><strong style="color:var(--ink)">${esc(aName(e.a))}</strong> · <span class="tag">${esc(CATS[e.k].s)}</span>${e.of?` · Konusu: ${esc(e.of)}`:""}</div>
        ${e.n?`<div class="x">${esc(e.n)}</div>`:""}</div></div>`).join("")}
    </section>`).join("");
  if(!keepFocus){
    $("#view").innerHTML = `<input class="search" id="libq" type="search" placeholder="Eser, müellif veya konu ara (ör. Buhârî, şerh, garîb)" value="${esc(q)}" aria-label="Kütüphanede ara"><div id="libout"></div>`;
    $("#libq").addEventListener("input",ev=>{ q=ev.target.value; renderLib(true); });
  }
  $("#libout").innerHTML = html || `<div class="empty">Aramanızla eşleşen eser yok. Seçili türleri ya da arama kelimesini değiştirin.</div>`;
}

/* ---------- genel ---------- */
function render(tabChange){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.v===view));
  renderScore();
  if(!tabChange){ tf=null; mt=null; ch=null; }
  if(view==="tf") renderTF(); else if(view==="match") renderMatch(); else if(view==="chrono") renderChrono(); else renderLib();
}
renderStats(); renderChips(); render();
</script>
